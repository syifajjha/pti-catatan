const ESSAY = [
{p:1,q:"Jelaskan pengertian Teknologi Informasi dan sebutkan dua kata kunci utamanya.",a:"Teknologi Informasi adalah teknologi yang berhubungan dengan pengolahan data menjadi informasi sekaligus proses penyaluran data/informasi tersebut. Kata kunci: (1) pengolahan data menjadi informasi yang bermakna, dan (2) penyaluran/penyebaran informasi yang tidak terbatas ruang dan waktu. TI merupakan pengembangan teknologi komputer yang dipadukan dengan teknologi komunikasi."},
{p:1,q:"Sebutkan dan jelaskan secara singkat 6 blok sistem informasi.",a:"1) Blok Masukan: data serta metode dan media penangkapan data, termasuk dokumen dasar.\n2) Blok Proses: kombinasi prosedur, logika, dan model matematika untuk mengolah data.\n3) Blok Keluaran: informasi berkualitas dan dokumentasi bagi manajemen.\n4) Blok Teknologi: brainware, software, dan hardware.\n5) Blok Basis Data: kumpulan data saling berhubungan yang dikelola DBMS.\n6) Blok Kendali: pengendalian terhadap kerusakan/kegagalan serta pemulihan sistem."},
{p:1,q:"Jelaskan perbedaan efisiensi, efektivitas, dan inovasi dalam pemanfaatan TI, lengkap dengan contoh.",a:"Efisiensi = doing things right: pekerjaan dilakukan dengan benar, lebih cepat, dan hemat sumber daya, contohnya otomatisasi pengisian formulir administrasi.\nEfektivitas = doing the right things: memilih strategi/tindakan yang tepat berdasarkan data, contohnya dashboard analitik yang membantu manajemen menentukan prioritas program.\nInovasi = doing new things: menciptakan model usaha atau produk baru, contohnya ride-hailing dan e-commerce yang mengubah cara bertransaksi. Inovasi adalah level tertinggi."},
{p:1,q:"Mengapa informasi harus berkualitas? Jelaskan empat kriteria kualitas informasi.",a:"Informasi yang tidak berkualitas akan menyesatkan pengambilan keputusan. Empat kriteria: (1) Relevansi — sesuai dengan masalah/tugas yang sedang diselesaikan; (2) Ketepatan waktu — informasi mutakhir, karena informasi terlambat menjadi usang; (3) Kelengkapan — menyajikan gambaran utuh tanpa kehilangan atribut penting; (4) Akurasi — benar dan bebas kesalahan. Pertemuan 2 menambahkan kriteria konsisten, yaitu tidak bertentangan antar sistem."},
{p:1,q:"Sebutkan enam fungsi TI dan berikan satu contoh untuk masing-masing fungsi.",a:"Capture: memindai KTP/berkas pendaftaran. Processing: aplikasi menghitung IP semester. Generating: sistem membuat laporan nilai. Storage: data nilai disimpan di database. Transmission: data KRS dikirim dari server ke laptop mahasiswa. Retrieval: mahasiswa mencari kembali riwayat nilai semester lalu."},
{p:1,q:"Apa yang dimaksud brainware dan mengapa keberadaannya penting dalam sistem komputer?",a:"Brainware (humanware) adalah manusia yang mengoperasikan komputer dan memberi instruksi. Tanpa brainware, hardware dan software tidak memiliki tujuan: tidak ada yang menentukan data apa yang diinput, aturan apa yang dipakai, dan bagaimana hasil ditafsirkan. Brainware juga yang membuat keputusan akhir dari informasi yang dihasilkan sistem."},
{p:2,q:"Jelaskan perbedaan data, informasi, pengetahuan, dan keputusan dengan contoh pada sistem akademik.",a:"Data = fakta mentah, misalnya nilai 85, 72, 90, 88 dan NIM 231001.\nInformasi = hasil pengolahan data yang berkonteks, misalnya IP semester 85,2 atau status 'memenuhi syarat KRS'.\nPengetahuan = pola/interpretasi, misalnya 'mahasiswa dengan kehadiran di bawah 60% cenderung berisiko gagal'.\nKeputusan = tindakan/kebijakan, misalnya prodi memberikan pendampingan akademik kepada mahasiswa berisiko. TI menghubungkan keempat tahap tersebut melalui pengumpulan, pengolahan, analisis, dan penyajian."},
{p:2,q:"Sebutkan tiga jenis data beserta contoh dan teknologi yang umum dipakai.",a:"1) Terstruktur: tabel mahasiswa, transaksi, nilai; teknologi RDBMS/SQL.\n2) Semi-terstruktur: JSON, XML, data API, konfigurasi; teknologi NoSQL, object storage, API.\n3) Tidak terstruktur: PDF, gambar, audio/video, email; teknologi object storage + search + AI.\nBentuk data menentukan cara penyimpanan, pemrosesan, dan analitiknya."},
{p:2,q:"Jelaskan perbedaan database dan DBMS serta posisinya dalam arsitektur TI.",a:"Database adalah kumpulan data terorganisasi (tabel mahasiswa, KRS, nilai), sedangkan DBMS adalah perangkat lunak yang mengelola database: menyediakan query, transaksi, hak akses, integritas, backup/recovery, dan concurrency. Posisinya: pengguna memakai aplikasi (web/mobile), aplikasi memanggil API/service, API mengakses DBMS, DBMS mengelola database di storage/server/cloud. Jadi aplikasi tidak mengakses file data secara langsung."},
{p:2,q:"Jelaskan perbedaan TI dan SI dengan contoh SIAKAD.",a:"TI berfokus pada komponen teknologi: hardware, software, database, jaringan, cloud, keamanan, dan AI; TI menyediakan kemampuan teknis. SI lebih luas karena mengintegrasikan manusia (mahasiswa, dosen, admin), proses (pengisian KRS, penilaian), data, teknologi, aturan akademik, dan tujuan organisasi. SIAKAD adalah SI karena di dalamnya ada server dan database (TI), tetapi juga ada prosedur, pengguna, dan kebijakan kampus yang mengatur layanan tersebut."},
{p:2,q:"Jelaskan konsep Data-Driven Decision Making (DDDM) dan tahapannya.",a:"DDDM adalah pengambilan keputusan berdasarkan data, bukan asumsi. Tahapannya: (1) kumpulkan data dari transaksi, log, sensor, aplikasi; (2) olah dengan ETL/ELT, SQL, atau program; (3) analisis dengan BI, statistik, atau ML/AI; (4) visualisasikan dalam dashboard/grafik/alert; (5) putuskan tindakan dan prioritas, lalu evaluasi. Contoh: data kehadiran + nilai + aktivitas LMS diolah menjadi dashboard mahasiswa berisiko, lalu prodi melakukan intervensi."},
{p:2,q:"Mengapa data disebut aset organisasi? Sebutkan risiko jika data diabaikan.",a:"Data menjadi aset karena dapat menghasilkan informasi dan keputusan yang bernilai, asalkan berkualitas, tersedia saat dibutuhkan, mudah ditemukan, dapat diintegrasikan, aman, memiliki pemilik/tanggung jawab, serta memiliki konteks dan metadata. Risiko jika diabaikan: data ganda, data salah, kebocoran, downtime, keputusan keliru, sulit integrasi, dan biaya operasional meningkat."},
{p:3,q:"Jelaskan evolusi TI dari era komputasi awal hingga era data dan AI.",a:"Komputasi awal: mesin besar, mahal, terpusat, dioperasikan tenaga khusus. Mainframe: satu komputer pusat melayani organisasi dengan batch processing. PC: komputasi personal dan terdistribusi. Internet & WWW: komputer saling terhubung dan web menjadi layanan informasi. Mobile & cloud: layanan selalu tersedia dan resource disediakan sebagai layanan. Data & AI: analytics, prediksi, dan generasi konten. Polanya: semakin kecil, terhubung, tersedia di mana saja, berbasis layanan, dan semakin cerdas."},
{p:3,q:"Apa perbedaan internet dan World Wide Web? Jelaskan dengan analogi.",a:"Internet adalah infrastruktur global yang menghubungkan banyak jaringan dan perangkat menggunakan protokol komunikasi. WWW adalah salah satu layanan di atas internet berupa halaman/aplikasi web yang diakses browser dengan HTTP/HTTPS. Analoginya: internet seperti jaringan jalan, sedangkan website seperti salah satu tujuan yang dapat dicapai melalui jalan itu. Email, video call, dan API juga layanan internet, tetapi bukan WWW."},
{p:3,q:"Jelaskan perkembangan web dari web statis hingga web + AI.",a:"Web awal bersifat statis: dokumen dan halaman, fokus membaca. Web interaktif menambahkan formulir, database, login, dan transaksi sehingga ada interaksi dua arah. Web sebagai platform menghadirkan marketplace, media sosial, SaaS, dan layanan online. Web + AI menambahkan rekomendasi, chatbot, copilot, dan agentic workflow sehingga web tidak hanya menyajikan informasi tetapi juga membantu pengguna menyelesaikan tugas."},
{p:3,q:"Jelaskan peran virtualisasi dan cloud dalam evolusi infrastruktur TI.",a:"Virtualisasi membagi resource satu server fisik menjadi beberapa mesin virtual sehingga pemanfaatan hardware lebih efisien dan layanan lebih terisolasi. Cloud kemudian menyediakan computing, storage, database, dan software sebagai layanan melalui jaringan, sehingga organisasi tidak harus memiliki seluruh hardware sendiri dan dapat menyesuaikan kapasitas sesuai kebutuhan. Tahap berikutnya cloud-native: aplikasi dirancang khusus untuk lingkungan cloud yang elastis dan otomatis."},
{p:3,q:"Bandingkan kampus tahun 2000-an dengan kampus digital. Sebutkan manfaat dan risiko barunya.",a:"Kampus 2000-an: komputer laboratorium, dokumen kertas, input manual, server lokal terbatas, informasi lewat papan pengumuman, komunikasi tatap muka/telepon. Kampus digital: SIAKAD web/mobile, LMS, cloud, database terintegrasi, presensi digital, dashboard, video conference, AI assistant.\nManfaat: layanan cepat, data terintegrasi, akses di mana saja, keputusan berbasis data.\nRisiko baru: keamanan data, privasi, ketergantungan pada jaringan, downtime, dan bias AI."},
{p:4,q:"Jelaskan fungsi CPU, RAM, storage, dan motherboard dengan analogi dapur.",a:"CPU = juru masak yang mengolah instruksi (Control Unit mengatur aliran instruksi, ALU menghitung, register menyimpan sementara sangat cepat). RAM = meja kerja untuk bahan yang sedang dipakai; isinya hilang saat daya mati. Storage = lemari untuk menyimpan bahan dan catatan secara permanen (SSD/HDD). Motherboard = ruang dapur yang menghubungkan semua bagian dan jalur komunikasinya."},
{p:4,q:"Jelaskan siklus instruksi CPU dan berikan contoh sederhana.",a:"Siklus: FETCH (mengambil instruksi dari memori), DECODE (menerjemahkan instruksi), EXECUTE (menjalankan operasi di ALU), WRITE-BACK (menuliskan hasil). Contoh saat menekan 7 + 5: keyboard/touchscreen mengirim input, aplikasi aktif memakai memori, CPU menjalankan operasi penjumlahan, lalu layar menampilkan hasil 12. Satu tindakan sederhana melibatkan banyak instruksi kecil."},
{p:4,q:"Mengapa CPU dengan GHz lebih tinggi belum tentu lebih cepat? Jelaskan faktornya.",a:"Karena kinerja dipengaruhi banyak faktor: jumlah core (pekerjaan paralel), ukuran dan kecepatan cache, rancangan arsitektur prosesor, efisiensi per instruksi, pendinginan (throttling saat panas), kapasitas RAM, kecepatan storage, serta jenis pekerjaan. Untuk beban tertentu (mis. kompilasi kode, render, analisis data) jumlah core dan cache lebih menentukan. Karena itu CPU harus dibandingkan berdasarkan workload nyata."},
{p:4,q:"Jelaskan perbedaan RAM dan storage serta kaitannya dengan kehilangan data.",a:"RAM adalah memori kerja sementara yang bersifat volatile: menampung program dan data yang sedang digunakan dan isinya hilang saat daya mati. Storage (SSD/HDD) bersifat persisten: menyimpan OS, aplikasi, file, dan database meski daya dimatikan. Karena itu dokumen yang belum disimpan masih berada di RAM dan dapat hilang saat listrik mati. Membiasakan save berkala, autosave, dan backup adalah solusi praktisnya."},
{p:4,q:"Bagaimana langkah mendiagnosis komputer yang terasa lambat?",a:"1) Amati gejala: hanya satu aplikasi atau seluruh sistem. 2) Periksa penggunaan CPU, RAM, dan storage I/O melalui task manager/monitoring. 3) Cek kapasitas storage yang hampir penuh. 4) Cek proses latar belakang dan startup. 5) Jika aplikasi berbasis server, periksa jaringan dan status layanan. 6) Simpulkan bottleneck berdasarkan bukti (metrik/log), baru lakukan perbaikan seperti menambah RAM, membersihkan storage, atau optimasi query."},
{p:4,q:"Bagaimana Anda memilih laptop untuk mahasiswa Sistem Informasi dengan anggaran terbatas?",a:"Prioritas: (1) RAM 16 GB (minimum 8 GB) untuk multitasking browser + IDE + dataset; (2) SSD 512 GB (minimum 256 GB) agar booting dan akses data cepat serta ruang proyek cukup; (3) CPU kelas menengah yang memadai untuk coding dan analisis sederhana; (4) baterai dan layar yang nyaman untuk kuliah; (5) GPU terintegrasi sudah cukup karena GPU khusus hanya dibutuhkan untuk gaming, rendering 3D, atau deep learning. Intinya konfigurasi seimbang, bukan spesifikasi tertinggi pada satu komponen."},
{p:5,q:"Jelaskan tiga jenis software beserta contohnya.",a:"1) System software: mengelola perangkat dan menyediakan lingkungan kerja — sistem operasi (Windows, Linux, macOS, Android, iOS), driver, utilitas.\n2) Application software: membantu pekerjaan pengguna — browser, pengolah kata, spreadsheet, SIAKAD, e-commerce.\n3) Programming software: membantu membuat dan menguji program — editor kode, compiler, debugger, IDE, version control."},
{p:5,q:"Jelaskan fungsi sistem operasi dan sumber daya yang dikelolanya.",a:"OS adalah perantara antara pengguna, aplikasi, dan hardware. Sumber daya yang dikelola: (1) CPU/proses — penjadwalan giliran eksekusi; (2) memori — alokasi RAM dan isolasi antarproses; (3) file — folder, nama, izin, baca/tulis; (4) perangkat I/O — komunikasi melalui driver; (5) jaringan — menyediakan layanan komunikasi; (6) keamanan — akun, autentikasi, hak akses, pembaruan."},
{p:5,q:"Jelaskan perbedaan program dan proses serta kaitannya dengan multitasking.",a:"Program adalah kumpulan instruksi yang tersimpan di disk dan belum tentu berjalan. Proses adalah program yang sedang berjalan beserta konteks eksekusinya, aktif di RAM dan dieksekusi CPU. Multitasking adalah kemampuan OS membagi waktu CPU (time-sharing) sehingga banyak proses terasa berjalan bersamaan; pada CPU multi-core beberapa proses dapat benar-benar berjalan paralel."},
{p:5,q:"Jelaskan peran driver dan file system dalam sistem operasi.",a:"Driver adalah perangkat lunak penerjemah antara OS dan perangkat keras tertentu (printer, kartu grafis, audio, adaptor jaringan) sehingga perintah aplikasi dapat diteruskan ke perangkat. File system memberi struktur dan aturan penyimpanan: membuat, membuka, membaca, mengubah, menghapus file, mengelola nama/lokasi, dan mengatur izin akses. Contoh file system: NTFS (Windows), ext4 (Linux), APFS (macOS)."},
{p:5,q:"Jelaskan perbedaan virtual machine dan container.",a:"Virtual machine menjalankan sistem operasi tamu (guest OS) sendiri di atas hypervisor, sehingga isolasinya kuat tetapi relatif berat karena setiap VM membawa OS lengkap. Container mengemas aplikasi beserta dependensinya dan berbagi kernel host, sehingga jauh lebih ringan dan cepat dijalankan, walau isolasinya berada pada level proses. Keduanya dipakai untuk menjalankan layanan secara terisolasi di server/cloud."},
{p:6,q:"Sebutkan dan jelaskan lima unsur komunikasi data.",a:"1) Pengirim: perangkat yang mengirim data. 2) Penerima: perangkat tujuan. 3) Media: kabel (twisted pair, fiber) atau gelombang radio. 4) Protokol: aturan pertukaran data. 5) Pesan: data yang dikirim. Analogi kurir: ada pengirim, alamat tujuan, jalur pengiriman, isi pesan, dan aturan layanan."},
{p:6,q:"Jelaskan perbedaan LAN, MAN, WAN, internet, intranet, dan Wi-Fi.",a:"LAN mencakup wilayah terbatas (ruangan, gedung, lab). MAN mencakup kota/kawasan metropolitan. WAN mencakup wilayah luas antarkota/negara. Internet adalah jaringan global yang menghubungkan banyak jaringan. Intranet adalah jaringan/layanan internal organisasi dengan akses terbatas. Wi-Fi adalah teknologi akses jaringan lokal tanpa kabel — Wi-Fi tidak otomatis berarti internet tersedia."},
{p:6,q:"Jelaskan fungsi switch, router, access point, modem/ONT, dan firewall.",a:"Switch menghubungkan perangkat dalam jaringan lokal (LAN). Router meneruskan paket data antarjaringan. Access point menyediakan akses nirkabel bagi laptop/ponsel. Modem/ONT menghubungkan jaringan pelanggan dengan layanan akses ISP. Firewall mengatur lalu lintas jaringan berdasarkan kebijakan keamanan. Satu perangkat dapat menggabungkan beberapa fungsi."},
{p:6,q:"Jelaskan perbedaan bandwidth, throughput, latency, dan packet loss dengan analogi jalan raya.",a:"Bandwidth = kapasitas maksimum jalur (bit/s), seperti jumlah lajur jalan. Throughput = laju data nyata yang berhasil diterima, seperti jumlah kendaraan yang benar-benar lewat. Latency = waktu tunda perjalanan data (ms), seperti waktu tempuh kendaraan ke tujuan. Packet loss = paket yang hilang saat transmisi, seperti kendaraan yang hilang di jalan. Jalan lebar (bandwidth besar) tetap bisa macet sehingga respons lambat."},
{p:6,q:"Bagaimana langkah troubleshooting ketika SIAKAD lambat saat KRS?",a:"Telusuri dari yang terdekat dengan pengguna: (1) perangkat pengguna — apakah hanya satu laptop yang bermasalah, RAM/tab/CPU penuh; (2) Wi-Fi/LAN — sinyal lemah atau kabel terputus; (3) jaringan kampus/ISP — apakah banyak pengguna terdampak; (4) DNS dan alamat IP — apakah konfigurasi benar; (5) server aplikasi/database — apakah sedang sibuk, query lambat, atau kapasitas kurang. Simpulkan berdasarkan bukti metrik/log, bukan dugaan."},
{p:7,q:"Jelaskan perbedaan internet dan WWW serta alur saat browser membuka website.",a:"Internet adalah infrastruktur jaringan global; WWW adalah layanan di atasnya berupa halaman/aplikasi web yang diakses browser via HTTP/HTTPS. Alur membuka website: pengguna memasukkan URL → DNS mencari alamat IP domain → browser membuat koneksi ke server → browser mengirim request → server mengirim response → browser melakukan render sehingga halaman tampil. Kegagalan dapat berasal dari DNS, koneksi, server, sertifikat, atau aplikasi web."},
{p:7,q:"Jelaskan CIA Triad dan berikan contoh untuk masing-masing aspek.",a:"Confidentiality (kerahasiaan): hanya pihak berwenang yang dapat melihat data, contohnya nilai mahasiswa hanya dapat diakses mahasiswa tersebut dan dosen yang berhak. Integrity (integritas): data tidak diubah tanpa izin dan perubahan dapat ditelusuri, contohnya nilai tidak boleh berubah tanpa proses resmi. Availability (ketersediaan): sistem dan data tersedia saat dibutuhkan, contohnya SIAKAD tetap dapat digunakan saat periode KRS."},
{p:7,q:"Jelaskan perbedaan authentication dan authorization beserta contohnya.",a:"Authentication menjawab 'Siapa Anda?' dengan memverifikasi identitas melalui password, OTP, passkey, atau autentikator. Authorization menjawab 'Apa yang boleh Anda akses?' dengan mengatur hak akses. Contoh: mahasiswa berhasil login (authentication), tetapi hanya boleh melihat nilainya sendiri dan tidak boleh mengubah nilai seluruh kelas (authorization). Login berhasil tidak berarti berhak membuka semua data."},
{p:7,q:"Sebutkan indikator phishing dan langkah aman menghadapinya.",a:"Indikator: (1) urgensi/ancaman waktu; (2) domain mirip dengan tambahan atau karakter aneh; (3) permintaan password, OTP, atau kode pemulihan; (4) lampiran/tautan tak terduga; (5) kanal tidak wajar (akun pribadi, grup chat). Langkah: berhenti, jangan klik, periksa melalui kanal resmi (aplikasi/situs resmi yang diketik manual), lalu laporkan ke helpdesk. Jangan mencari-cari kesalahan eja saja karena phishing modern bisa sangat rapi."},
{p:7,q:"Jelaskan langkah respons jika Anda terlanjur memasukkan password ke situs palsu.",a:"1) Hentikan interaksi, jangan memasukkan data tambahan atau menyetujui permintaan login. 2) Ganti kredensial melalui situs/aplikasi resmi dari perangkat tepercaya; ganti juga password lain yang sama. 3) Amankan sesi: keluar dari sesi lain, aktifkan MFA, periksa metode pemulihan. 4) Laporkan ke helpdesk/administrator resmi dengan waktu dan bukti yang aman. 5) Pantau aktivitas akun dan transaksi. Jangan menghapus bukti atau menyebarkan tautan berbahaya."},
{p:7,q:"Jelaskan prinsip Zero Trust, least privilege, dan monitoring dalam keamanan modern.",a:"Zero Trust: jangan otomatis mempercayai akses hanya karena berasal dari jaringan internal; verifikasi berdasarkan konteks dan kebijakan. Least privilege: berikan hak minimum yang diperlukan untuk menjalankan tugas, misalnya akun mahasiswa, dosen, operator, dan administrator tidak memiliki hak yang sama. Monitoring: catat aktivitas penting dan tindak lanjuti anomali secara proporsional agar insiden cepat terdeteksi."}
];

const KASUS = [
{p:1,t:"Kasus: Penerapan 6 blok sistem informasi",

 q:"Petakan kebutuhan sistem tersebut ke dalam 6 blok sistem informasi dan jelaskan isi tiap blok.",
 a:"Masukan: data anggota, formulir pinjaman, bukti pembayaran (dokumen dasar), metode input formulir digital.\nProses: prosedur verifikasi pinjaman, logika perhitungan bunga, model matematika angsuran.\nKeluaran: laporan bulanan, kartu angsuran, rekap tunggakan, dokumentasi.\nTeknologi: brainware (admin koperasi), software (aplikasi simpan pinjam), hardware (komputer, printer).\nBasis data: tabel anggota, pinjaman, angsuran, dikelola DBMS.\nKendali: validasi input, backup harian, hak akses petugas, prosedur pemulihan bila server mati."},
{p:2,t:"Kasus: Dashboard mahasiswa berisiko",
 s:"Prodi memiliki data kehadiran, nilai, dan aktivitas LMS. Pimpinan ingin mengetahui mahasiswa yang berisiko tertinggal agar bisa segera diintervensi.",
 q:"Jelaskan bagaimana alur DDDM diterapkan, dari data mentah hingga keputusan.",
 a:"1) Kumpulkan: data kehadiran, nilai, dan log aktivitas LMS dari SIAKAD/LMS.\n2) Olah: ETL/ELT membersihkan dan menggabungkan data per mahasiswa, SQL menghitung indikator (persentase kehadiran, IP, jumlah tugas tidak dikumpulkan).\n3) Analisis: statistik/ML memberi skor risiko.\n4) Visualisasi: dashboard menampilkan daftar mahasiswa berisiko dengan warna/alert.\n5) Keputusan: prodi menghubungi mahasiswa, menawarkan konsultasi, atau menyesuaikan strategi pembelajaran, lalu mengevaluasi hasil intervensi."},
{p:4,t:"Kasus: SIAKAD lambat saat KRS",
 s:"Pada awal semester ribuan mahasiswa mengakses SIAKAD bersamaan. Halaman lambat dan sebagian permintaan gagal. Ada mahasiswa yang menyimpulkan 'laptop saya yang rusak'.",
 q:"Analisis kemungkinan penyebab dan langkah pemeriksaan yang tepat.",
 a:"Penyebab tidak tunggal: (a) perangkat pengguna (RAM penuh, banyak tab, CPU sibuk); (b) Wi-Fi/LAN padat atau sinyal lemah; (c) jaringan kampus/ISP; (d) DNS/IP salah konfigurasi; (e) server aplikasi kelebihan beban; (f) database lambat karena query tidak optimal atau lock.\nLangkah: cek apakah hanya satu pengguna atau banyak, periksa metrik CPU/RAM/I/O server, log aplikasi dan query, lalu solusi: optimasi query, indeks, cache, penjadwalan KRS per angkatan, atau penambahan kapasitas. Simpulkan berdasarkan bukti, bukan dugaan."},
{p:4,t:"Kasus: Memilih laptop mahasiswa SI",
 s:"Seorang mahasiswa memiliki anggaran terbatas. Temannya menyarankan membeli laptop dengan GPU kelas tinggi karena 'pasti lebih baik'. Kebutuhan: Office, browser, coding Python/Java, dan analisis dataset sederhana.",
 q:"Beri rekomendasi konfigurasi dan alasannya.",
 a:"Prioritas bukan GPU. Rekomendasi: CPU kelas menengah (cukup untuk coding dan analisis sederhana), RAM 16 GB (minimum 8 GB) untuk multitasking browser + IDE + dataset, SSD 512 GB (minimum 256 GB) untuk OS, aplikasi, dan proyek, serta GPU terintegrasi yang sudah memadai. GPU khusus baru diperlukan untuk gaming, rendering 3D/video, atau deep learning. Konfigurasi seimbang lebih penting daripada satu komponen berspesifikasi ekstrem, dan dana sebaiknya dialokasikan ke RAM, SSD, dan CPU."},
{p:4,t:"Kasus: File hilang setelah listrik mati",
 s:"Mahasiswa mengedit dokumen tugas, belum menekan save, lalu listrik mati. Perubahan terakhir hilang, tetapi file versi lama masih ada di laptop.",
 q:"Jelaskan mengapa hal itu terjadi dan apa solusinya.",
 a:"Perubahan terakhir masih berada di RAM yang bersifat volatile, jadi hilang saat daya mati. Versi lama tetap ada karena sudah tersimpan di storage (persisten). Solusi: biasakan save berkala (Ctrl+S), aktifkan autosave, gunakan penyimpanan cloud dengan sinkronisasi, dan lakukan backup. Ini juga alasan dalam sistem informasi backup dan prosedur pemulihan data menjadi bagian penting."},
{p:5,t:"Kasus: Aplikasi tidak bisa dibuka",
 s:"Seorang pengguna mengeluh aplikasi tidak berjalan. Ia menekan ikon aplikasi tetapi tidak terjadi apa-apa, sementara Wi-Fi menyala.",
 q:"Bagian mana yang perlu diperiksa lebih dulu dan bukti apa yang mendukung dugaan?",
 a:"Periksa berurutan: (1) input/perangkat — apakah klik terdeteksi; (2) OS — apakah proses aplikasi terbentuk, ada pesan error, atau aplikasi crash; (3) RAM/storage — apakah penuh; (4) driver/software — apakah aplikasi kompatibel dan terpasang benar; (5) jaringan — jika aplikasi berbasis server. Bukti: Task Manager (proses/CPU/RAM), log aplikasi, ruang disk tersisa, dan status layanan server. Jangan langsung menyimpulkan Wi-Fi sebagai penyebab."},
{p:6,t:"Kasus: Merancang jaringan kampus",
 s:"Kampus memiliki gedung administrasi, laboratorium komputer, perpustakaan, dan area Wi-Fi mahasiswa. Jaringan administrasi harus terpisah dari jaringan mahasiswa.",
 q:"Rancang kebutuhan perangkat dan pemisahan jaringannya.",
 a:"Setiap gedung: switch untuk LAN, access point untuk area nirkabel. Antar gedung dihubungkan ke router (dan switch inti/core) dengan media fiber optic untuk kapasitas dan jarak. Modem/ONT menghubungkan kampus ke ISP. Firewall ditempatkan di batas jaringan untuk mengatur lalu lintas, dan segmentasi/VLAN memisahkan jaringan administrasi, laboratorium, perpustakaan, dan Wi-Fi mahasiswa. Jika SIAKAD lambat, periksa bertahap: perangkat → AP/switch → router/ISP → DNS/IP → server aplikasi."},
{p:6,t:"Kasus: Bandwidth besar tetapi lambat",
 s:"Kampus meningkatkan bandwidth internet dari 100 Mbps menjadi 1 Gbps. Namun aplikasi SIAKAD tetap terasa lambat saat jam sibuk, terutama saat membuka halaman laporan.",
 q:"Jelaskan kemungkinan penyebab dan metrik yang perlu diperiksa.",
 a:"Bandwidth besar hanya menambah kapasitas jalur. Penyebab lain: latency tinggi, packet loss, kemacetan di jaringan internal, DNS lambat, server aplikasi kelebihan beban, atau query database yang berat (khususnya laporan). Metrik yang diperiksa: throughput nyata vs bandwidth, latency (ping), packet loss, utilisasi link, waktu respons server, dan waktu eksekusi query. Solusi bisa berupa optimasi query, caching, indexing, atau penambahan kapasitas server — bukan sekadar menambah bandwidth."},
{p:7,t:"Kasus: Email 'admin kampus'",
 s:"Mahasiswa menerima email dengan subjek 'Akun SIAKAD akan dinonaktifkan hari ini'. Isinya meminta verifikasi password melalui tautan dalam 30 menit.",
 q:"Identifikasi indikator phishing, data yang berpotensi dicuri, dan tindakan aman.",
 a:"Indikator: urgensi/ancaman waktu, permintaan password (institusi resmi tidak meminta password via email), tautan yang belum diverifikasi, dan domain yang mungkin mirip. Data berpotensi dicuri: email/kredensial SIAKAD, token sesi, OTP, dan data pribadi. Tindakan aman: jangan klik; buka SIAKAD dengan mengetik alamat resmi secara manual; periksa kanal resmi kampus; laporkan ke helpdesk; jika sudah terlanjur memasukkan password, segera ganti password dari perangkat tepercaya, aktifkan MFA, dan pantau aktivitas akun."},
{p:7,t:"Kasus: QR code di poster",
 s:"Di dinding kampus ditempel poster bertuliskan 'Perpanjang akses Wi-Fi dengan memindai QR ini'. Beberapa mahasiswa memindai dan diminta memasukkan username serta password kampus.",
 q:"Apa risiko utama dan bagaimana seharusnya bersikap?",
 a:"Risiko: QR phishing (quishing) — kode mengarah ke situs/formulir palsu yang mencuri kredensial, atau ke halaman pembayaran tiruan. Kredensial yang diperoleh dapat dipakai mengambil alih akun dan menyebarkan phishing lanjutan. Sikap aman: periksa domain yang terbuka setelah memindai; jangan memasukkan kredensial; akses layanan resmi secara manual; laporkan poster/kode tersebut ke IT kampus; jika sudah memasukkan data, ganti password dan aktifkan MFA."},
{p:7,t:"Kasus: Akun teman mengirim pesan reset akun",
 s:"Sejumlah mahasiswa menerima email 'reset akun'. Sebagian memasukkan password pada situs tiruan. Setelah itu, akun mereka mengirim pesan serupa ke teman sekelas.",
 q:"Analisis dampak dan susun langkah penanganan untuk mahasiswa serta pengelola portal.",
 a:"Dampak: kredensial dicuri, akun diambil alih, penyebaran phishing berantai, potensi akses data akademik, dan reputasi kampus terganggu.\nMahasiswa: hentikan interaksi, ganti password dari situs resmi, aktifkan MFA, logout semua sesi, periksa email/nomor pemulihan, laporkan ke helpdesk, pantau aktivitas.\nPengelola: reset kredensial akun terdampak, tinjau log akses, blokir domain/tautan phishing, kirim pengumuman resmi, dan edukasi pengguna tentang verifikasi kanal resmi."},
{p:2,t:"Kasus: Data lama yang beredar",
 s:"Sebuah pemberitaan menyebut dugaan jual beli data ilegal. Pihak berwenang menjelaskan bahwa data yang ramai dibicarakan adalah data lama yang kembali muncul.",
 q:"Mengapa data lama tetap berbahaya dan apa pelajarannya bagi pengguna?",
 a:"Data lama tetap berbahaya karena dapat digabungkan dengan sumber lain untuk menyusun penipuan yang lebih meyakinkan, menebak password (terutama bila password dipakai ulang), dan mengetahui informasi pemulihan akun. Pelajaran: ganti password yang digunakan ulang, aktifkan MFA, waspadai pesan yang menyebut data pribadi secara spesifik, gunakan kanal resmi untuk melapor, dan jangan menyebarkan data pribadi orang lain."},

const $  = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));

const SHORT = {1:"Pengenalan TI",2:"Data & Informasi",3:"Sejarah & Evolusi",4:"Hardware & CPU",5:"I/O, Software, OS",6:"Jaringan Komputer",7:"Internet & Keamanan"};
const LABEL = {A:"A",B:"B",C:"C",D:"D"};

function lsGet(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function getDone(){ return new Set(lsGet("pti_done", [])); }
function saveDone(s){ lsSet("pti_done", Array.from(s)); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function markActive(route){
  $$("#nav .nav-item").forEach(b => b.classList.toggle("active", b.dataset.go === route));

/* ---------- ROUTER ---------- */
function go(id){
  if(location.hash === "#" + id){ route(); return; }
  location.hash = id;
}

function route(){
  const h = decodeURIComponent(location.hash.replace(/^#/, "")) || "home";
  let title = "Beranda";
  const view = $("#view");
  $("#sidebar").classList.remove("open");
  $("#overlay").classList.remove("show");

  if(h === "home"){ view.innerHTML = viewHome(); title = "Beranda"; }
  else if(h === "catatan"){ view.innerHTML = viewCatatan(); title = "Catatan Ujian"; }
  else if(h.startsWith("materi/")){
    const id = parseInt(h.split("/")[1], 10);
    view.innerHTML = viewMateri(id); title = "Pertemuan " + id;
  }
  else if(h === "pg"){ view.innerHTML = viewPG(); title = "Pilihan Ganda"; initPG(); }
  else if(h === "tf"){ view.innerHTML = viewTF(); title = "Benar / Salah"; }
  else if(h === "isian"){ view.innerHTML = viewIsian(); title = "Isian Singkat"; }
  else if(h === "essay"){ view.innerHTML = viewEssay(); title = "Soal Uraian"; }
  else if(h === "kasus"){ view.innerHTML = viewKasus(); title = "Studi Kasus"; }
  else if(h === "ujian"){ view.innerHTML = viewUjian(); title = "Simulasi UTS"; }
  else if(h === "glosarium"){ view.innerHTML = viewGlosarium(); title = "Glosarium"; }
  else { view.innerHTML = viewHome(); }

  markActive(h);
  $("#crumbNow").textContent = title;
  document.title = "PTI · " + title;
  window.scrollTo(0, 0);
}

/* ---------- PILIHAN GANDA ---------- */
let PGSTATE = { f:0, q:"", order:[], answered:{} };

function pgOrder(){
  let idx = PG.map((_, i) => i);
  if(PGSTATE.f) idx = idx.filter(i => PG[i].p === PGSTATE.f);
  const q = PGSTATE.q.toLowerCase().trim();
  if(q) idx = idx.filter(i => (PG[i].q + " " + PG[i].o.join(" ")).toLowerCase().includes(q));
  return idx;
}

function viewPG(){
  const total = PG.length;
  return `
  <h1>Bank Soal Pilihan Ganda</h1>
  <p class="muted">${total} soal. Pilih jawaban → langsung muncul koreksi dan penjelasan. Filter per pertemuan kalau ingin fokus.</p>
  <div class="chips no-print" id="pgChips">
    <button class="chip active" data-f="0">Semua (${total})</button>
    ${MATERI.map(m => {
      const n = PG.filter(x => x.p === m.id).length;
      return '<button class="chip" data-f="' + m.id + '">P' + m.id + ' (' + n + ')</button>';
    }).join("")}
  </div>
  <div class="bar no-print">
    <div class="search"><input id="pgSearch" type="search" placeholder="Cari soal…"></div>
    <button class="btn ghost sm" id="pgReset">Reset jawaban</button>
    <button class="btn ghost sm" id="pgShuffle">Acak urutan</button>
    <span class="small muted" id="pgCount" style="margin-left:auto"></span>
  </div>
  <div id="pgList"></div>`;
}

function pgCard(i, n){
  const q = PG[i];
  const chosen = PGSTATE.answered[i];
  const opts = q.o.map((o, k) => {
    let cls = "opt";
    if(chosen !== undefined){
      if(k === q.a) cls += " correct";
      else if(k === chosen) cls += " wrong";
    }
    return '<button class="' + cls + '" data-pick="' + i + '" data-opt="' + k + '"' + (chosen !== undefined ? " disabled" : "") + '><span class="k">' + LABEL[String.fromCharCode(65+k)] + '</span><span>' + o + '</span></button>';
  }).join("");
  return '<div class="qcard" data-card="' + i + '">' +
    '<div class="qhead"><div class="qno">' + n + '</div><div class="qtext">' + q.q + ' <span class="pill" style="font-size:.6rem;vertical-align:middle">P' + q.p + '</span></div></div>' +
    '<div class="opts">' + opts + '</div>' +
    '<div class="explain' + (chosen !== undefined ? " show" : "") + '"><b>Jawaban: ' + String.fromCharCode(65 + q.a) + '.</b> ' + q.e + '</div>' +
    '</div>';
}

function renderPGList(){
  const idx = PGSTATE.order.length ? PGSTATE.order : pgOrder();
  const list = $("#pgList");
  if(!list) return;
  if(!idx.length){ list.innerHTML = '<div class="empty">Tidak ada soal yang cocok. Coba kata kunci lain.</div>'; updatePGCount(); return; }
  list.innerHTML = idx.map((i, n) => pgCard(i, n+1)).join("");
  updatePGCount();
}

function updatePGCount(){
  const idx = PGSTATE.order.length ? PGSTATE.order : pgOrder();
  const answered = idx.filter(i => PGSTATE.answered[i] !== undefined);
  const benar = idx.filter(i => PGSTATE.answered[i] === PG[i].a);
  const el = $("#pgCount");
  if(el) el.textContent = answered.length + "/" + idx.length + " dijawab · benar " + benar.length;
}

function initPG(){
  PGSTATE.order = [];
  renderPGList();
  const chips = $("#pgChips");
  if(chips) chips.addEventListener("click", e => {
    const b = e.target.closest("[data-f]"); if(!b) return;
    PGSTATE.f = parseInt(b.dataset.f, 10);
    $$("#pgChips .chip").forEach(c => c.classList.toggle("active", c === b));
    renderPGList();
  });
  const s = $("#pgSearch");
  if(s) s.addEventListener("input", () => { PGSTATE.q = s.value; PGSTATE.order = []; renderPGList(); });
  const r = $("#pgReset");
  if(r) r.addEventListener("click", () => { PGSTATE.answered = {}; renderPGList(); toast("Jawaban direset"); });
  const sh = $("#pgShuffle");
  if(sh) sh.addEventListener("click", () => {
    const arr = pgOrder().slice();
    for(let i = arr.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
    PGSTATE.order = arr; renderPGList(); toast("Soal diacak");
  });
}

/* ---------- SIMULASI UTS ---------- */
let EXAM = null;

function shuffle(a){ for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function buildExam(){
  const pool = shuffle(PG.map((_, i) => i)).slice(0, 60);
  return pool.map(i => {
    const q = PG[i];
    const pairs = q.o.map((o, k) => ({o, ok:k === q.a}));
    shuffle(pairs);
    return { p:q.p, q:q.q, o:pairs.map(x => x.o), a:pairs.findIndex(x => x.ok), e:q.e, pick:null };
  });
}

function viewUjian(){
  const best = lsGet("pti_best", null);
  return `
  <h1>Simulasi UTS</h1>
  <p class="muted">60 soal pilihan ganda acak dari seluruh pertemuan, waktu 60 menit. Skor dihitung otomatis (skala 0–100).</p>
  <div class="card" style="text-align:center;padding:30px">
    <div style="font-size:52px;line-height:1">⏱️</div>
    <h2 style="margin:8px 0 4px">Siap mencoba?</h2>
    <p class="muted small" style="max-width:460px;margin:0 auto 16px">Sebelum mulai, siapkan kertas dan pensil. Jangan buka catatan dulu — ini untuk mengukur kesiapanmu.</p>
    ${best !== null ? '<p class="small">Skor terbaikmu: <b style="color:var(--ok)">' + best + '</b></p>' : ''}
    <button class="btn primary" id="startExam">Mulai simulasi</button>
  </div>
  <div class="grid g2">
    <div class="card tight"><h3 style="font-size:.92rem">Aturan</h3><ul class="small" style="margin:0;padding-left:1.15em"><li>60 soal, 4 pilihan.</li><li>Waktu 60 menit, otomatis dikumpulkan saat habis.</li><li>Boleh ganti jawaban sebelum dikumpulkan.</li><li>Setelah dikumpulkan, muncul pembahasan semua soal.</li></ul></div>
    <div class="card tight"><h3 style="font-size:.92rem">Penilaian</h3><ul class="small" style="margin:0;padding-left:1.15em"><li>Skor = (benar / 60) × 100.</li><li>Target minimal: 70.</li><li>Salah tidak mengurangi nilai.</li><li>Kosong dihitung salah.</li></ul></div>
  </div>`;
}

function startExam(){
  EXAM = { qs:buildExam(), answers:new Array(60).fill(null), left:60*60, timer:null };
  const v = $("#view");
  v.innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px">
      <h1 style="margin:0;font-size:1.4rem">Simulasi UTS</h1>
      <div class="spacer"></div>
      <div class="timer" id="timer">60:00</div>
      <button class="btn primary" id="submitExam">Kumpulkan</button>
    </div>
    <div class="progress" style="margin-bottom:4px"><i id="examProg" style="width:0%"></i></div>
    <p class="small muted" id="examProgTxt">0/60 terjawab</p>
    <div id="examList">
      ${EXAM.qs.map((q, i) => `
      <div class="qcard">
        <div class="qhead"><div class="qno">${i+1}</div><div class="qtext">${q.q} <span class="pill" style="font-size:.6rem;vertical-align:middle">P${q.p}</span></div></div>
        <div class="opts">
          ${q.o.map((o, k) => '<button class="opt" data-ex="' + i + '" data-opt="' + k + '"><span class="k">' + LABEL[String.fromCharCode(65+k)] + '</span><span>' + o + '</span></button>').join("")}
        </div>
      </div>`).join("")}
    </div>
    <div class="bar" style="margin-top:8px"><button class="btn primary" id="submitExam2">Kumpulkan jawaban</button></div>`;

  EXAM.timer = setInterval(() => {
    EXAM.left--;
    const t = $("#timer");
    if(!t){ clearInterval(EXAM.timer); return; }
    const m = Math.floor(EXAM.left / 60), s = EXAM.left % 60;
    t.textContent = String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
    if(EXAM.left <= 300) t.classList.add("low");
    if(EXAM.left <= 0){ clearInterval(EXAM.timer); finishExam(); }
  }, 1000);

  $("#submitExam").addEventListener("click", finishExam);
  $("#submitExam2").addEventListener("click", finishExam);
  window.scrollTo({top:0});
}

function finishExam(){
  if(!EXAM) return;
  clearInterval(EXAM.timer);
  const answered = EXAM.answers.filter(a => a !== null).length;
  if(answered < 60 && EXAM.left > 0 && !confirm("Baru " + answered + "/60 soal terjawab. Kumpulkan sekarang?")) {
    EXAM.timer = setInterval(() => {
      EXAM.left--;
      const t = $("#timer");
      if(!t){ clearInterval(EXAM.timer); return; }
      const m = Math.floor(EXAM.left / 60), s = EXAM.left % 60;
      t.textContent = String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
      if(EXAM.left <= 0){ clearInterval(EXAM.timer); finishExam(); }
    }, 1000);
    return;
  }
  const benar = EXAM.qs.reduce((n, q, i) => n + (EXAM.answers[i] === q.a ? 1 : 0), 0);
  const skor = Math.round(benar / EXAM.qs.length * 100);
  const best = lsGet("pti_best", null);
  if(best === null || skor > best) lsSet("pti_best", skor);

  const v = $("#view");
  const grade = skor >= 85 ? "Luar biasa! 🎉" : skor >= 70 ? "Bagus, pertahankan! 👍" : skor >= 55 ? "Cukup — ulangi bagian yang salah. 💪" : "Perlu belajar lagi, mulai dari catatan ujian. 📚";
  v.innerHTML = `
    <h1>Hasil Simulasi UTS</h1>
    <div class="card" style="text-align:center">
      <div style="font-size:3.2rem;font-weight:800;letter-spacing:-.03em;color:${skor>=70?'var(--ok)':'var(--bad)'}">${skor}</div>
      <p style="margin:0"><b>${benar}</b> benar dari ${EXAM.qs.length} soal</p>
      <p class="muted">${grade}</p>
      <p class="small muted" style="margin-bottom:0">Skor terbaik tersimpan: ${lsGet("pti_best", skor)}</p>
    </div>
    <div class="bar no-print">
      <button class="btn primary" id="reviewBtn">Lihat pembahasan</button>
      <button class="btn ghost" data-go="pg">Latihan per pertemuan</button>
      <button class="btn ghost" data-go="ujian">Ulangi simulasi</button>
    </div>
    <div id="reviewBox"></div>`;

  const review = () => {
    const box = $("#reviewBox");
    if(box.innerHTML) { box.innerHTML = ""; return; }
    const wrong = EXAM.qs.map((q, i) => ({q, i})).filter(x => EXAM.answers[x.i] !== x.q.a);
    box.innerHTML = '<h2>' + (wrong.length ? 'Soal yang perlu diulang (' + wrong.length + ')' : 'Semua benar! 🎯') + '</h2>' +
      (wrong.length ? wrong.map(({q, i}) => `
        <div class="qcard">
          <div class="qhead"><div class="qno">${i+1}</div><div class="qtext">${q.q} <span class="pill" style="font-size:.6rem">P${q.p}</span></div></div>
          <div class="opts">
            ${q.o.map((o, k) => {
              const cls = k === q.a ? "opt correct" : (k === EXAM.answers[i] ? "opt wrong" : "opt");
              return '<button class="' + cls + '" disabled><span class="k">' + String.fromCharCode(65+k) + '</span><span>' + o + '</span></button>';
            }).join("")}
          </div>
          <div class="explain show"><b>Jawaban: ${String.fromCharCode(65+q.a)}.</b> ${q.e}</div>
        </div>`).join("") : '<div class="card">Tidak ada yang salah. Coba naikkan level dengan mengerjakan soal uraian.</div>');
    if(box.scrollIntoView) box.scrollIntoView({behavior:"smooth", block:"start"});
  };
  $("#reviewBtn").addEventListener("click", review);
}

/* ---------- EVENT DELEGATION ---------- */
document.addEventListener("click", e => {
  const goEl = e.target.closest("[data-go]");
  if(goEl){ e.preventDefault(); go(goEl.dataset.go); return; }

  const chip = e.target.closest("#pgChips .chip");
  if(!chip && e.target.closest("[data-pick]")){
    const btn = e.target.closest("[data-pick]");
    const i = parseInt(btn.dataset.pick, 10), k = parseInt(btn.dataset.opt, 10);
    if(PGSTATE.answered[i] !== undefined) return;
    PGSTATE.answered[i] = k;
    const card = btn.closest(".qcard");
    $$("[data-opt]", card).forEach(b => {
      b.disabled = true;
      const kk = parseInt(b.dataset.opt, 10);
      if(kk === PG[i].a) b.classList.add("correct");
      else if(kk === k) b.classList.add("wrong");
    });
    const ex = $(".explain", card);
    if(ex) ex.classList.add("show");
    updatePGCount();
    return;
  }

  const tfBtn = e.target.closest("[data-tfq]");
  if(tfBtn){
    const i = parseInt(tfBtn.dataset.tfq, 10);
    const val = tfBtn.dataset.val === "1";
    const ok = val === TF[i].a;
    tfBtn.classList.add(ok ? "correct" : "wrong");
    const row = tfBtn.parentElement;
    $$(".tf-btn", row).forEach(b => b.disabled = true);
    const card = tfBtn.closest(".qcard");
    $(".explain", card).classList.add("show");
    return;
  }

  const exBtn = e.target.closest("[data-ex]");
  if(exBtn){
    const i = parseInt(exBtn.dataset.ex, 10), k = parseInt(exBtn.dataset.opt, 10);
    if(!EXAM) return;
    EXAM.answers[i] = k;
    const card = exBtn.closest(".qcard");
    $$(".opt", card).forEach(b => b.classList.toggle("correct", false));
    $$(".opt", card).forEach(b => { b.style.outline = "none"; });
    $$(".opt", card).forEach(b => {
      if(parseInt(b.dataset.opt, 10) === k) b.style.outline = "2px solid var(--accent)";
    });
    const n = EXAM.answers.filter(a => a !== null).length;
    const pr = $("#examProg"), pt = $("#examProgTxt");
    if(pr) pr.style.width = (n / 60 * 100) + "%";
    if(pt) pt.textContent = n + "/60 terjawab";
    return;
  }
});

document.addEventListener("input", e => {
  if(e.target.id === "glosSearch"){
    const q = e.target.value.toLowerCase();
    $$("#glossList .gloss-item").forEach(it => {
      it.style.display = it.textContent.toLowerCase().includes(q) ? "" : "none";
    });
  }
});

document.addEventListener("click", e => {
  if(e.target.id === "startExam"){ startExam(); return; }
  if(e.target.id === "printNote" || e.target.id === "printBtn"){ try{ window.print(); }catch(err){} return; }
  if(e.target.id === "doneBtn"){
    const id = parseInt(e.target.dataset.id, 10);
    const d = getDone();
    if(d.has(id)) d.delete(id); else d.add(id);
    saveDone(d);
    toast(d.has(id) ? "Ditandai selesai ✓" : "Ditandai belum selesai");
    route();
    return;
  }
  if(e.target.id === "tfReset"){
    route();
    toast("Jawaban direset");
    return;
  }
  if(e.target.closest("[data-openall]")){
    $$("details.qa").forEach(d => d.open = true);
    return;
  }
  if(e.target.closest("[data-closeall]")){
    $$("details.qa").forEach(d => d.open = false);
    return;
  }
});

/* ---------- TEMA, MENU, TOAST ---------- */
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  $("#themeBtn").innerHTML = t === "dark"
    ? '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  lsSet("pti_theme", t);
}
$("#themeBtn").addEventListener("click", () => {
  const now = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(now);
});
$("#menuBtn").addEventListener("click", () => {
  $("#sidebar").classList.toggle("open");
  $("#overlay").classList.toggle("show");
});
$("#overlay").addEventListener("click", () => {
  $("#sidebar").classList.remove("open");
  $("#overlay").classList.remove("show");
});

let toastT;
function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove("show"), 1800);
}

/* ---------- INIT ---------- */
applyTheme(lsGet("pti_theme", "light"));
buildNav();
route();
window.addEventListener("hashchange", route);
</script>
</body>
