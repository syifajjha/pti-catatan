<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PTI — Catatan Ujian & Bank Soal UTS</title>
<style>
:root{
  --bg:#f4f6fb; --panel:#ffffff; --panel2:#eef1f9; --text:#101828; --muted:#5b6478;
  --line:#e3e7f1; --accent:#4f46e5; --accent2:#7c3aed; --ok:#0e9f6e; --bad:#e02424;
  --warn:#c27803; --info:#1c64f2;
  --shadow:0 10px 30px rgba(16,24,40,.08); --radius:16px;
}
[data-theme="dark"]{
  --bg:#0a0e18; --panel:#111827; --panel2:#1a2234; --text:#e9edf7; --muted:#98a3b8;
  --line:#233046; --shadow:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
}
a{color:var(--accent); text-decoration:none}
h1,h2,h3,h4{line-height:1.25; margin:0 0 .5em}
h1{font-size:1.7rem; letter-spacing:-.02em}
h2{font-size:1.28rem; letter-spacing:-.01em}
h3{font-size:1.05rem}
p{margin:0 0 .8em}
ul,ol{margin:.2em 0 .9em; padding-left:1.3em}
li{margin:.25em 0}
code{background:var(--panel2); padding:.12em .4em; border-radius:6px; font-size:.9em;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
strong{font-weight:650}

/* ---------- LAYOUT ---------- */
.app{display:flex; min-height:100vh}
.sidebar{
  width:272px; flex:0 0 272px; background:var(--panel); border-right:1px solid var(--line);
  height:100vh; position:sticky; top:0; display:flex; flex-direction:column; z-index:60;
}
.brand{padding:20px 18px 14px; border-bottom:1px solid var(--line)}
.brand-badge{
  display:inline-flex; align-items:center; gap:8px; font-weight:700; font-size:.9rem;
  background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff;
  padding:6px 12px; border-radius:999px; letter-spacing:.02em;
}
.brand h1{font-size:1rem; margin:12px 0 2px}
.brand p{margin:0; font-size:.76rem; color:var(--muted)}
nav{flex:1; overflow-y:auto; padding:12px 10px 30px}
.nav-group{margin:14px 0 4px; padding:0 10px; font-size:.68rem; letter-spacing:.13em;
  text-transform:uppercase; color:var(--muted); font-weight:700}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:10px;
  color:var(--text); font-size:.88rem; cursor:pointer; border:none; background:none;
  width:100%; text-align:left; font-family:inherit; transition:.15s;
}
.nav-item:hover{background:var(--panel2)}
.nav-item.active{background:linear-gradient(135deg,rgba(79,70,229,.14),rgba(124,58,237,.12));
  color:var(--accent); font-weight:650}
[data-theme="dark"] .nav-item.active{color:#a5b4fc}
.nav-item .ic{width:20px; text-align:center; font-size:.95em; opacity:.9}
.nav-item .cnt{margin-left:auto; font-size:.72rem; background:var(--panel2); color:var(--muted);
  padding:1px 7px; border-radius:999px}
.nav-item.active .cnt{background:rgba(79,70,229,.18); color:inherit}

.main{flex:1; min-width:0; display:flex; flex-direction:column}
.topbar{
  position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:12px;
  padding:12px 22px; background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
}
.crumb{font-size:.85rem; color:var(--muted); font-weight:600}
.crumb span{color:var(--text)}
.spacer{flex:1}
.icon-btn{
  border:1px solid var(--line); background:var(--panel); color:var(--text); cursor:pointer;
  width:38px; height:38px; border-radius:11px; display:grid; place-items:center; font-size:1rem;
  transition:.15s;
}
.icon-btn:hover{border-color:var(--accent); color:var(--accent)}
.icon-btn svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.btn svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; vertical-align:-3px; margin-right:6px}
#menuBtn{display:none}
.view{padding:26px 22px 70px; max-width:1080px; width:100%; margin:0 auto}
footer{padding:18px 22px 40px; text-align:center; color:var(--muted); font-size:.78rem}

/* ---------- COMPONENTS ---------- */
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:20px; box-shadow:var(--shadow); margin-bottom:16px}
.card.tight{padding:15px 17px}
.grid{display:grid; gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.pill{display:inline-block; font-size:.7rem; font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; padding:3px 9px; border-radius:999px;
  background:rgba(79,70,229,.12); color:var(--accent)}
[data-theme="dark"] .pill{color:#a5b4fc}
.pill.g{background:rgba(14,159,110,.14); color:var(--ok)}
.pill.r{background:rgba(224,36,36,.12); color:var(--bad)}
.pill.y{background:rgba(194,120,3,.14); color:var(--warn)}
.pill.b{background:rgba(28,100,242,.12); color:var(--info)}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.hero{
  background:linear-gradient(135deg,#4f46e5,#7c3aed 55%,#db2777); color:#fff;
  border-radius:22px; padding:34px 30px; border:none; box-shadow:0 18px 40px rgba(79,70,229,.3);
  margin-bottom:20px;
}
.hero h1{font-size:1.9rem; margin-bottom:.35em}
.hero p{color:rgba(255,255,255,.92); max-width:640px}
.hero .row{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px}
.hero .btns{display:flex; gap:10px; flex-wrap:wrap; margin-top:20px}
.btn{
  border:none; cursor:pointer; font-family:inherit; font-size:.88rem; font-weight:650;
  padding:10px 16px; border-radius:11px; background:var(--panel2); color:var(--text); transition:.15s;
}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--accent); color:#fff}
.btn.light{background:#fff; color:#4f46e5}
.btn.ghost{background:transparent; border:1px solid var(--line)}
.btn.sm{padding:6px 11px; font-size:.8rem; border-radius:9px}
.hero .stat{background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.25);
  padding:8px 13px; border-radius:11px; font-size:.8rem; font-weight:600}

.materi-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px}
.materi-card{
  background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px;
  cursor:pointer; transition:.18s; position:relative; overflow:hidden;
}
.materi-card:hover{border-color:var(--accent); transform:translateY(-2px); box-shadow:var(--shadow)}
.materi-card .no{
  font-size:.72rem; font-weight:800; color:var(--accent); letter-spacing:.1em; text-transform:uppercase;
}
.materi-card h3{margin:6px 0 4px; font-size:.98rem}
.materi-card p{font-size:.82rem; color:var(--muted); margin:0}
.done-dot{position:absolute; top:12px; right:12px; width:20px; height:20px; border-radius:50%;
  border:2px solid var(--line); display:grid; place-items:center; font-size:.65rem; color:transparent}
.materi-card.done .done-dot{background:var(--ok); border-color:var(--ok); color:#fff}

.seksi{margin-bottom:18px}
.seksi h3{display:flex; align-items:center; gap:9px; margin-bottom:.5em}
.seksi h3::before{content:""; width:4px; height:18px; border-radius:3px;
  background:linear-gradient(180deg,var(--accent),var(--accent2))}
.box{background:var(--panel2); border-radius:12px; padding:13px 15px; margin:.6em 0; font-size:.92rem}
.box.tip{border-left:3px solid var(--ok)}
.box.warn{border-left:3px solid var(--warn)}
.box.info{border-left:3px solid var(--accent)}
.box.bad{border-left:3px solid var(--bad)}
table{width:100%; border-collapse:collapse; font-size:.87rem; margin:.6em 0 1em;
  display:block; overflow-x:auto; white-space:nowrap}
th,td{padding:9px 12px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top}
th{background:var(--panel2); font-weight:700; font-size:.8rem; text-transform:uppercase;
  letter-spacing:.04em; color:var(--muted)}
tbody tr:hover{background:color-mix(in srgb, var(--panel2) 55%, transparent)}
td{white-space:normal}

.chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px}
.chip{
  border:1px solid var(--line); background:var(--panel); color:var(--muted); cursor:pointer;
  padding:7px 13px; border-radius:999px; font-size:.82rem; font-family:inherit; font-weight:600;
  transition:.15s;
}
.chip:hover{border-color:var(--accent)}
.chip.active{background:var(--accent); color:#fff; border-color:var(--accent)}

.qcard{background:var(--panel); border:1px solid var(--line); border-radius:14px;
  padding:17px 18px; margin-bottom:13px; box-shadow:0 3px 10px rgba(16,24,40,.04)}
.qhead{display:flex; gap:10px; align-items:flex-start; margin-bottom:10px}
.qno{flex:0 0 28px; height:28px; border-radius:8px; background:var(--panel2); color:var(--muted);
  display:grid; place-items:center; font-size:.78rem; font-weight:800}
.qtext{font-weight:600; flex:1}
.opts{display:grid; gap:7px; margin-left:38px}
.opt{
  border:1px solid var(--line); background:transparent; color:var(--text); text-align:left;
  padding:9px 12px; border-radius:10px; cursor:pointer; font-family:inherit; font-size:.9rem;
  display:flex; gap:10px; align-items:flex-start; transition:.13s;
}
.opt:hover{border-color:var(--accent); background:var(--panel2)}
.opt .k{font-weight:800; color:var(--muted); flex:0 0 14px}
.opt.correct{border-color:var(--ok); background:rgba(14,159,110,.1)}
.opt.correct .k{color:var(--ok)}
.opt.wrong{border-color:var(--bad); background:rgba(224,36,36,.09)}
.opt.wrong .k{color:var(--bad)}
.opt[disabled]{cursor:default}
.explain{margin:10px 0 0 38px; font-size:.86rem; padding:10px 12px; border-radius:10px;
  background:var(--panel2); border-left:3px solid var(--accent); display:none}
.explain.show{display:block}
.explain b{color:var(--accent)}
[data-theme="dark"] .explain b{color:#a5b4fc}

details.qa{background:var(--panel); border:1px solid var(--line); border-radius:13px;
  padding:14px 17px; margin-bottom:11px}
details.qa summary{cursor:pointer; font-weight:600; list-style:none; display:flex; gap:10px;
  align-items:flex-start}
details.qa summary::-webkit-details-marker{display:none}
details.qa summary::before{content:"▸"; color:var(--accent); font-weight:800; transition:.15s}
details.qa[open] summary::before{transform:rotate(90deg)}
details.qa .ans{margin-top:11px; padding-top:11px; border-top:1px dashed var(--line);
  font-size:.9rem; color:var(--text)}
details.qa .ans .lbl{font-size:.7rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ok); display:block; margin-bottom:4px}

.tf-row{display:flex; gap:8px; margin-left:38px; margin-top:8px}
.tf-btn{border:1px solid var(--line); background:transparent; color:var(--text); padding:6px 18px;
  border-radius:9px; cursor:pointer; font-family:inherit; font-weight:650; font-size:.85rem}
.tf-btn:hover{border-color:var(--accent)}
.tf-btn.correct{border-color:var(--ok); background:rgba(14,159,110,.12); color:var(--ok)}
.tf-btn.wrong{border-color:var(--bad); background:rgba(224,36,36,.1); color:var(--bad)}

.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:18px}
.stat-box{background:var(--panel); border:1px solid var(--line); border-radius:13px; padding:14px 16px}
.stat-box .v{font-size:1.5rem; font-weight:800; letter-spacing:-.02em}
.stat-box .l{font-size:.76rem; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; font-weight:700}

.progress{height:8px; border-radius:999px; background:var(--panel2); overflow:hidden}
.progress > i{display:block; height:100%; width:0;
  background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .4s}

.timer{font-variant-numeric:tabular-nums; font-weight:800; font-size:1rem; padding:8px 14px;
  border-radius:11px; background:var(--panel2); border:1px solid var(--line)}
.timer.low{color:var(--bad); border-color:var(--bad)}

.gloss{display:grid; gap:10px}
.gloss-item{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 15px}
.gloss-item b{color:var(--accent)}
[data-theme="dark"] .gloss-item b{color:#a5b4fc}

.search{position:relative; flex:1; max-width:340px}
.search input{
  width:100%; padding:9px 13px 9px 36px; border-radius:11px; border:1px solid var(--line);
  background:var(--panel); color:var(--text); font-family:inherit; font-size:.88rem; outline:none;
}
.search input:focus{border-color:var(--accent)}
.search::before{content:"🔍"; position:absolute; left:12px; top:50%; transform:translateY(-50%);
  font-size:.85rem; opacity:.6}
.empty{text-align:center; padding:40px 20px; color:var(--muted)}
.bar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px}
.kbd{font-size:.72rem; border:1px solid var(--line); border-bottom-width:2px; border-radius:5px;
  padding:1px 5px; color:var(--muted)}
mark{background:rgba(250,204,21,.4); color:inherit; border-radius:3px; padding:0 2px}
.toast{position:fixed; bottom:22px; left:50%; transform:translate(-50%,80px); z-index:200;
  background:var(--text); color:var(--bg); padding:11px 20px; border-radius:11px; font-size:.85rem;
  font-weight:600; opacity:0; transition:.3s; pointer-events:none}
.toast.show{transform:translate(-50%,0); opacity:1}
.overlay{position:fixed; inset:0; background:rgba(6,10,20,.55); z-index:55; display:none}
.overlay.show{display:block}

@media(max-width:980px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:820px){
  .sidebar{position:fixed; left:0; top:0; transform:translateX(-105%); transition:.25s;
    box-shadow:0 0 40px rgba(0,0,0,.3)}
  .sidebar.open{transform:none}
  #menuBtn{display:grid}
  .view{padding:18px 14px 60px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .hero{padding:24px 20px}
  .hero h1{font-size:1.45rem}
  .opts,.explain,.tf-row{margin-left:0}
  .search{max-width:none}
  .topbar{padding:10px 14px}
  .crumb{display:none}
}
@media print{
  .sidebar,.topbar,footer,.no-print,.toast{display:none !important}
  body{background:#fff; font-size:11pt}
  .card{box-shadow:none; border:1px solid #ddd; break-inside:avoid}
  .view{padding:0; max-width:none}
  details.qa{break-inside:avoid}
  details.qa .ans{display:block !important}
  a{color:#000}
}
</style>
</head>
<body>
<div class="overlay" id="overlay"></div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-badge">📚 PTI • UTS</span>
      <h1>Catatan & Bank Soal</h1>
      <p>Pengantar Teknologi Informasi — Semester 1</p>
    </div>
    <nav id="nav"></nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Menu">☰</button>
      <div class="crumb">PTI / <span id="crumbNow">Beranda</span></div>
      <div class="spacer"></div>
      <button class="icon-btn" id="printBtn" title="Cetak / PDF"><svg viewBox="0 0 24 24"><path d="M6 9V3h12v6"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="7"/></svg></button>
      <button class="icon-btn" id="themeBtn" title="Mode gelap">🌙</button>
    </header>
    <main class="view" id="view"></main>
    <footer>Dibuat dari 7 materi PPT Pengantar Teknologi Informasi &amp; tugas kelompok · Belajar terarah, bukan sekadar hafal.</footer>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   MATERI RINGKAS — Pertemuan 1 & 2
   ============================================================ */
const MATERI = [
{
  id:1, tag:"Pertemuan 1", judul:"Pengenalan Teknologi Informasi",
  ringkas:"Definisi TI, sistem informasi, 6 blok sistem informasi, fungsi & keunggulan TI, kualitas informasi.",
  seksi:[
    { t:"Tiga lapis pengertian yang sering ditanyakan", html:`
      <p><b>Teknologi</b> = cara/alat untuk memenuhi kebutuhan. <b>Informasi</b> = hasil pengolahan data yang memiliki arti. <b>Teknologi Informasi (TI)</b> menyatukan keduanya:</p>
      <ul>
        <li>Pengembangan dari <b>teknologi komputer yang dipadukan dengan teknologi komunikasi</b>.</li>
        <li>Teknologi yang berhubungan dengan <b>pengolahan data menjadi informasi</b> dan <b>penyaluran data/informasi dalam batas ruang dan waktu</b>.</li>
        <li>Secara praktis: sekumpulan alat yang membantu bekerja dengan informasi — printer, keyboard, CD-ROM, aplikasi multimedia, hingga internet.</li>
      </ul>
      <div class="box info"><b>Sistem dan Teknologi Informasi</b> = sistem yang menggunakan teknologi komputer untuk <b>mengumpulkan, memproses, menyimpan, menganalisis, dan menyebarkan</b> informasi. Hafalkan 5 kata kerjanya — sering keluar sebagai soal urutan.</div>
    `},
    { t:"6 blok sistem informasi (John Burch & Gary Grudnitski)", html:`
      <p>Enam blok yang saling berinteraksi untuk mencapai sasaran sistem informasi:</p>
      <ol>
        <li><b>Blok Masukan (Input)</b> — data + metode &amp; media penangkapan data, termasuk <b>dokumen dasar</b>.</li>
        <li><b>Blok Proses</b> — kombinasi <b>prosedur, logika, dan model matematika</b> yang memanipulasi data input maupun data di database.</li>
        <li><b>Blok Keluaran (Output)</b> — produk informasi berkualitas + dokumentasi bagi semua tingkatan manajemen.</li>
        <li><b>Blok Teknologi</b> — "kotak alat", terdiri dari <b>3 bagian: brainware/humanware, software, hardware</b>.</li>
        <li><b>Blok Basis Data</b> — kumpulan data saling berhubungan, disimpan di perangkat keras dan dimanipulasi perangkat lunak. Diakses/dimanipulasi dengan <b>DBMS (Database Management System)</b>.</li>
        <li><b>Blok Kendali</b> — dirancang untuk menanggulangi kerusakan/kegagalan sistem, mengendalikan hal yang merusak sistem, dan mempercepat pemulihan bila terjadi kesalahan.</li>
      </ol>
      <div class="box warn"><b>Jebakan:</b> "Blok Jaringan", "Blok Pengguna", "Blok Internet" <u>bukan</u> bagian dari 6 blok versi Burch &amp; Grudnitski.</div>
    `},
    { t:"Mengapa TI dibutuhkan & apa fungsinya", html:`
      <p><b>Perlunya TI</b> (4 hal, hafalkan sebagai KGRT):</p>
      <ul>
        <li><b>K</b>ompleksitas tugas manajemen</li>
        <li><b>G</b>lobalisasi (pengaruh globalisasi)</li>
        <li><b>R</b>esponse time cepat yang dibutuhkan</li>
        <li><b>T</b>ekanan persaingan bisnis</li>
      </ul>
      <p><b>Fungsi TI</b> (6 hal): <b>Capture</b> (menangkap), <b>Processing</b> (mengolah), <b>Generating</b> (menghasilkan), <b>Storage</b> (menyimpan), <b>Transmission</b> (transmisi), <b>Retrieval</b> (mencari kembali).</p>
      <div class="box tip"><b>Cara ingat:</b> Cap-Pro-Gen-Sto-Trans-Ret. Yang <u>bukan</u> fungsi TI biasanya pilihan seperti "menghapus data", "mencetak", atau "merancang gedung".</div>
    `},
    { t:"Keuntungan, kemampuan, dan tujuan TI", html:`
      <p><b>Kemampuan/keuntungan teknis:</b> <b>Speed</b> (cepat), <b>Consistency</b> (konsisten), <b>Precision</b> (presisi/akurat), <b>Reliability</b> (andal).</p>
      <p><b>Tujuan pemanfaatan TI:</b> memecahkan masalah, membuka kreativitas, meningkatkan <b>efektivitas</b> dan <b>efisiensi</b>.</p>
      <p><b>Contoh bidang pengguna TI:</b> akuntansi, finance, marketing, produksi, manajemen SDM.</p>
      <p><b>3 elemen komputer:</b> <b>Hardware</b> (perangkat keras), <b>Software</b> (perangkat lunak), <b>Brainware</b> (manusia/pengguna). Tanpa brainware, komputer tidak tahu apa yang harus dikerjakan.</p>
    `},
    { t:"Informasi yang berkualitas — 4 kriteria wajib", html:`
      <ul>
        <li><b>Relevansi (Relevance)</b> — sesuai dan berhubungan langsung dengan tugas/masalah yang sedang diselesaikan.</li>
        <li><b>Ketepatan waktu (Timeliness)</b> — informasi harus mutakhir; informasi terlambat menjadi usang dan kehilangan nilai.</li>
        <li><b>Kelengkapan (Completeness)</b> — menyajikan gambaran yang utuh, tidak kehilangan atribut penting.</li>

{
  id:4, tag:"Pertemuan 4", judul:"Hardware, CPU, Memori & Storage",
  ringkas:"CPU & siklus instruksi, RAM vs storage, cache, GPU/NPU, diagnosis komputer lambat.",
  seksi:[
    { t:"Hardware & analogi dapur", html:`
      <p><b>Hardware</b> = bagian fisik komputer yang dapat dilihat/disentuh; menyediakan kemampuan agar software dapat berjalan. Software berisi instruksi, hardware yang menjalankannya.</p>
      <table><thead><tr><th>Komponen</th><th>Analogi dapur</th><th>Fungsi</th></tr></thead><tbody>
      <tr><td>CPU</td><td>Juru masak</td><td>Mengolah/menjalankan instruksi</td></tr>
      <tr><td>RAM</td><td>Meja kerja</td><td>Menampung bahan yang sedang dipakai</td></tr>
      <tr><td>Storage</td><td>Lemari</td><td>Menyimpan bahan &amp; catatan permanen</td></tr>
      <tr><td>Motherboard</td><td>Ruang dapur</td><td>Menghubungkan semua bagian</td></tr>
      </tbody></table>
      <p><b>Alur informasi:</b> Input (keyboard/mouse) → Process (CPU menjalankan instruksi) → RAM (menampung pekerjaan aktif) → Storage &amp; layar (menyimpan &amp; menampilkan hasil).</p>
    `},
    { t:"CPU: tiga bagian & siklus instruksi", html:`
      <p>CPU sering disebut "otak komputer" (hanya analogi — CPU tidak berpikir seperti manusia). Bagiannya:</p>
      <ul>
        <li><b>Control Unit (CU)</b> — mengatur aliran instruksi.</li>
        <li><b>ALU (Arithmetic Logic Unit)</b> — operasi aritmetika dan logika.</li>
        <li><b>Register</b> — penyimpanan kecil dan <b>sangat cepat</b> di dalam CPU.</li>
      </ul>
      <p><b>Siklus instruksi (urutan):</b> <b>FETCH</b> (ambil instruksi) → <b>DECODE</b> (terjemahkan) → <b>EXECUTE</b> (lakukan operasi) → <b>WRITE-BACK</b> (tuliskan hasil).</p>
      <div class="box tip"><b>Contoh 7 + 5:</b> keyboard mengirim input → aplikasi memakai memori → CPU menjalankan operasi → layar menampilkan 12. Satu tindakan sederhana = banyak instruksi kecil.</div>
    `},
    { t:"Kinerja CPU: GHz bukan segalanya", html:`
      <p>Kinerja dipengaruhi <b>clock (GHz)</b>, <b>core</b>, <b>cache</b>, rancangan prosesor, <b>pendinginan</b>, dan <b>jenis pekerjaan (workload)</b>.</p>
      <ul>
        <li><b>Clock</b> = frekuensi kerja, bukan satu-satunya ukuran.</li>
        <li><b>Core</b> = unit pemrosesan; membantu pekerjaan paralel.</li>
        <li><b>Cache</b> = memori kecil berkecepatan tinggi untuk data yang sering dipakai.</li>
      </ul>
      <div class="box warn"><b>Miskonsepsi:</b> "GHz tertinggi selalu tercepat" → SALAH. Bandingkan CPU berdasarkan workload nyata.</div>
    `},
    { t:"RAM vs Storage vs Cache", html:`
      <p><b>RAM</b> menampung program &amp; data yang <b>sedang digunakan</b>. Bersifat <b>volatile</b> — isinya hilang saat daya mati. <b>Storage</b> menyimpan OS, aplikasi, foto, dokumen, basis data secara <b>persisten</b>.</p>
      <ul>
        <li><b>HDD</b> — piringan magnetik, ada bagian mekanis.</li>
        <li><b>SSD</b> — memori flash, tanpa bagian bergerak, umumnya lebih responsif.</li>
      </ul>
      <p><b>Hierarki kecepatan:</b> Register → Cache → RAM → Storage (makin ke bawah makin besar kapasitas &amp; makin lambat).</p>
      <div class="box bad"><b>Jebakan klasik:</b> "RAM 16 GB berarti storage 16 GB" → SALAH. Menambah SSD <u>bukan</u> sama dengan menambah RAM.</div>
    `},
    { t:"Diagnosis komputer lambat", html:`
      <p>Komputer lambat <b>tidak selalu</b> berarti CPU rusak. Amati gejala dan penggunaan resource:</p>
      <ul>
        <li>RAM penuh karena banyak aplikasi/tab → sistem memakai <b>paging</b>/memori virtual (lebih lambat).</li>
        <li>Storage hampir penuh atau sibuk (I/O tinggi).</li>
        <li>CPU menjalankan proses berat.</li>
        <li>Aplikasi berbasis server dapat terganggu <b>jaringan</b>, bukan perangkat.</li>
      </ul>
      <div class="box info"><b>Prinsip:</b> periksa metrik dan log, jangan menebak. Bottleneck bisa di CPU, RAM, storage I/O, jaringan, atau server.</div>
    `},
    { t:"Motherboard, I/O, GPU, NPU, dan infrastruktur", html:`
      <p><b>Motherboard</b> menghubungkan CPU, RAM, storage. <b>Input:</b> keyboard, mouse, mikrofon, kamera. <b>Output:</b> monitor, speaker, printer. Komponen harus <b>kompatibel</b>.</p>
      <ul>
        <li><b>CPU</b> — pekerjaan umum: OS, aplikasi, logika program.</li>
        <li><b>GPU</b> — grafis dan komputasi paralel.</li>
        <li><b>NPU (Neural Processing Unit)</b> — mikroprosesor khusus untuk tugas AI/machine learning secara efisien di perangkat.</li>
      </ul>
      <p><b>Server &amp; cloud:</b> server fisik punya CPU, RAM, storage, jaringan; <b>virtualisasi</b> membagi resource menjadi mesin virtual; cloud menyediakan resource melalui jaringan.</p>
      <p><b>Memilih laptop mahasiswa SI:</b> Office/web → responsif, RAM cukup, SSD. Programming → RAM, SSD, CPU, kompatibilitas. Data/AI → tergantung ukuran data/model. <b>GPU/NPU tidak wajib untuk semua orang.</b></p>
    `}
  ],

{
  id:5, tag:"Pertemuan 5", judul:"Perangkat I/O, Software & Sistem Operasi",
  ringkas:"Input/output, jenis software, fungsi OS, program vs proses, VM vs container.",
  seksi:[
    { t:"Perangkat input & output", html:`
      <p><b>Input</b> — komputer menerima data: keyboard, mouse/touchpad, scanner (dokumen fisik → citra digital), kamera, mikrofon, sensor (suhu, cahaya, gerak, sidik jari).</p>
      <p><b>Output</b> — komputer menyampaikan hasil: monitor, printer, speaker/headset, proyektor, <b>haptic</b> (getaran/sensasi sentuhan sebagai umpan balik).</p>
      <div class="box info"><b>Layar sentuh</b> adalah input <u>dan</u> output sekaligus. Ini pertanyaan favorit.</div>
      <p><b>Alur:</b> Input → Proses → Output. Contoh cetak KRS: klik tombol cetak (input) → aplikasi &amp; OS menyiapkan data (proses) → PDF tampil / printer mencetak (output).</p>
    `},
    { t:"Tiga jenis software", html:`
      <ul>
        <li><b>System software</b> — mengelola perangkat &amp; menyediakan lingkungan kerja: sistem operasi, driver, utilitas.</li>
        <li><b>Application software</b> — membantu pekerjaan pengguna: browser, pengolah kata, aplikasi akademik (SIAKAD), e-commerce.</li>
        <li><b>Programming software</b> — membantu membuat &amp; menguji program: editor kode, compiler, debugger, <b>IDE</b> (Integrated Development Environment: menulis, menguji, memperbaiki kode).</li>
      </ul>
      <div class="box warn">Hardware tanpa software tidak punya instruksi praktis untuk menjalankan tugas.</div>
    `},
    { t:"Sistem operasi: perantara & pengelola", html:`
      <p>OS menjadi perantara antara <b>pengguna ↔ aplikasi ↔ hardware</b>. Aplikasi meminta layanan OS, bukan mengendalikan perangkat sembarangan.</p>
      <p><b>Fungsi OS:</b></p>
      <ul>
        <li><b>CPU/proses</b> — menentukan proses yang mendapat waktu CPU (penjadwalan).</li>
        <li><b>Memori</b> — mengalokasikan RAM &amp; menjaga ruang proses (isolasi).</li>
        <li><b>File</b> — folder, nama, baca/tulis, izin.</li>
        <li><b>Perangkat I/O</b> — komunikasi dengan printer/keyboard/layar lewat <b>driver</b>.</li>
        <li><b>Jaringan</b> — menyediakan layanan komunikasi.</li>
        <li><b>Keamanan</b> — akun, autentikasi, hak akses, pembaruan.</li>
      </ul>
    `},
    { t:"Program vs Proses, multitasking, memori virtual", html:`
      <p><b>Program</b> = kumpulan instruksi yang tersimpan (file aplikasi di disk). <b>Proses</b> = program yang <b>sedang berjalan</b> beserta konteks eksekusinya (aktif di RAM, dieksekusi CPU).</p>
      <p><b>Multitasking:</b> OS membagi waktu CPU (time-sharing) sehingga banyak aplikasi terasa berjalan bersamaan. Pada CPU <b>multi-core</b>, beberapa pekerjaan benar-benar dapat berjalan paralel.</p>
      <p><b>Memori virtual:</b> saat RAM penuh, sistem memakai sebagian storage sebagai perpanjangan memori → membantu, tetapi <b>jauh lebih lambat</b> (paging).</p>
    `},
    { t:"File system, driver, dan keamanan OS", html:`
      <p><b>File system</b> memberi struktur lokasi &amp; aturan: membuat, membuka, membaca, mengubah, menghapus, mengatur nama/lokasi/izin. Contoh: <b>NTFS</b> (Windows), <b>ext4</b> (Linux), <b>APFS</b> (macOS).</p>
      <p><b>Driver</b> = penerjemah antara OS dan perangkat tertentu (printer, kartu grafis, audio, adaptor jaringan).</p>
      <p><b>Keamanan OS:</b> akun &amp; autentikasi, hak akses, pembaruan (bug &amp; celah keamanan), proteksi perangkat (firewall, enkripsi, anti-malware).</p>
      <div class="box warn"><b>Backup tetap perlu</b> walau ada file system: file terhapus, perangkat rusak, atau ransomware bisa menghilangkan data.</div>
    `},
    { t:"Platform, VM, dan container", html:`
      <p><b>Platform OS:</b> Windows (PC/laptop, kantor), GNU/Linux (server, cloud, pengembangan), macOS (komputer Mac), Android/iOS (mobile). Prinsip dasarnya sama: mengelola sumber daya &amp; menyediakan layanan aplikasi.</p>
      <p><b>Virtual Machine (VM):</b> satu komputer fisik menjalankan beberapa mesin virtual; setiap VM dapat punya <b>guest OS</b> sendiri; <b>hypervisor</b> mengelola pembagian sumber daya.</p>
      <p><b>Container:</b> mengemas aplikasi + dependensinya, mengisolasi lingkungan proses, umumnya <b>berbagi kernel host</b> → lebih ringan daripada VM.</p>
      <p><b>Studi kasus buka browser:</b> klik ikon (input) → browser mulai (OS buat proses + alokasi RAM) → permintaan web (layanan jaringan) → data diterima (CPU+RAM memproses) → halaman tampil (GPU/display output, cache disimpan).</p>
    `}
  ],
  tabel:[
    {judul:"Jenis software", head:["Jenis","Fungsi","Contoh"],
     rows:[["System software","Mengelola perangkat & lingkungan kerja","Windows, Linux, driver, antivirus"],
           ["Application software","Membantu pekerjaan pengguna","Browser, Word, SIAKAD, e-commerce"],
           ["Programming software","Membuat & menguji program","IDE, compiler, debugger, version control"]]},
    {judul:"Fungsi sistem operasi", head:["Sumber daya","Yang diatur OS"],
     rows:[["CPU/proses","Penjadwalan giliran eksekusi"],
           ["Memori","Alokasi RAM, isolasi antarproses"],
           ["File","Folder, izin, baca/tulis"],
           ["Perangkat I/O","Komunikasi via driver"],
           ["Jaringan","Layanan komunikasi data"],
           ["Keamanan","Akun, autentikasi, hak akses, update"]]},
    {judul:"VM vs Container", head:["Aspek","Virtual Machine","Container"],
     rows:[["Guest OS","Punya sendiri","Tidak; berbagi kernel host"],
           ["Pengelola","Hypervisor","Container engine"],
           ["Bobot","Lebih berat","Lebih ringan"],
           ["Isolasi","Kuat (level hardware virtual)","Level proses"]]}
  ],
  kunci:["Input: keyboard, mouse, scanner, kamera, mikrofon, sensor. Output: monitor, printer, speaker, proyektor, haptic.",
         "Layar sentuh = input sekaligus output.",
         "Software: sistem, aplikasi, pemrograman (IDE = menulis, menguji, memperbaiki kode).",
         "OS = perantara pengguna–aplikasi–hardware; mengatur CPU, memori, file, I/O, jaringan, keamanan.",
         "Program = instruksi tersimpan; Proses = program sedang berjalan.",
         "Memori virtual memakai storage saat RAM penuh → lebih lambat.",
         "File system: NTFS (Windows), ext4 (Linux), APFS (macOS). Driver = penerjemah OS–perangkat.",
         "VM punya guest OS + hypervisor; container berbagi kernel host → lebih ringan."]

{
  id:6, tag:"Pertemuan 6", judul:"Jaringan Komputer & Telekomunikasi",
  ringkas:"LAN/MAN/WAN, perangkat jaringan, IP/DNS/DHCP, bandwidth vs latency, troubleshooting.",
  seksi:[
    { t:"Konsep dasar & unsur komunikasi data", html:`
      <p><b>Jaringan komputer</b> = sekumpulan perangkat yang saling terhubung untuk <b>bertukar data dan berbagi sumber daya</b> (internet, printer bersama, berkas, aplikasi, basis data).</p>
      <div class="box warn">Jaringan <u>bukan</u> hanya internet. Jaringan lokal tetap bekerja tanpa akses internet.</div>
      <p><b>5 unsur komunikasi data:</b></p>
      <ol>
        <li><b>Pengirim</b> — perangkat yang mengirim data.</li>
        <li><b>Penerima</b> — perangkat tujuan.</li>
        <li><b>Media</b> — kabel atau gelombang radio.</li>
        <li><b>Protokol</b> — aturan pertukaran data.</li>
        <li><b>Pesan</b> — data yang dikirim.</li>
      </ol>
      <p><i>Analogi kurir:</i> pengirim, alamat tujuan, jalur, isi pesan, aturan layanan.</p>
    `},
    { t:"Cakupan jaringan & istilah yang sering tertukar", html:`
      <ul>
        <li><b>LAN</b> (Local Area Network) — wilayah terbatas: rumah, laboratorium, kantor, satu gedung.</li>
        <li><b>MAN</b> (Metropolitan Area Network) — wilayah kota/kawasan metropolitan, antarlokasi satu kota.</li>
        <li><b>WAN</b> (Wide Area Network) — wilayah luas, antarkota/negara, mis. perusahaan antarcabang.</li>
      </ul>
      <p><b>Internet</b> = jaringan global yang menghubungkan banyak jaringan. <b>Intranet</b> = jaringan/layanan internal organisasi dengan akses terbatas (mis. portal pegawai). <b>Wi-Fi</b> = teknologi akses jaringan lokal <b>tanpa kabel</b>.</p>
      <div class="box bad"><b>Jebakan:</b> "Wi-Fi selalu berarti internet tersedia" → SALAH. Laptop bisa terhubung ke Wi-Fi kampus tetapi internet gagal bila koneksi ISP bermasalah.</div>
    `},
    { t:"Perangkat jaringan & media transmisi", html:`
      <ul>
        <li><b>Switch</b> — menghubungkan perangkat dalam jaringan lokal (LAN).</li>
        <li><b>Router</b> — meneruskan paket data <b>antarjaringan</b>.</li>
        <li><b>Access Point</b> — menyediakan akses nirkabel bagi laptop/ponsel.</li>
        <li><b>Modem / ONT</b> — menghubungkan jaringan pelanggan dengan layanan akses ISP.</li>
        <li><b>Firewall</b> — mengatur lalu lintas berdasarkan kebijakan keamanan.</li>
      </ul>
      <p>Satu perangkat dapat menggabungkan beberapa fungsi (mis. modem+router+AP).</p>
      <p><b>Media transmisi:</b></p>
      <ul>
        <li><b>Twisted pair</b> — kabel tembaga berpilin; Ethernet rumah/kantor/lab.</li>
        <li><b>Fiber optic</b> — cahaya; kapasitas tinggi &amp; jarak jauh.</li>
        <li><b>Wireless</b> — gelombang radio (Wi-Fi, seluler); fleksibel tetapi dipengaruhi penghalang &amp; interferensi.</li>
      </ul>
      <p>Pemilihan media mempertimbangkan biaya, jarak, kapasitas, kondisi lokasi, dan mobilitas.</p>
    `},
    { t:"IP address, DNS, dan DHCP", html:`
      <p><b>IP address</b> = alamat logis untuk mengidentifikasi antarmuka/perangkat pada jaringan IP (analogi: alamat tujuan paket).</p>
      <ul>
        <li><b>IPv4</b> — 32-bit, contoh <code>192.168.10.25</code>.</li>
        <li><b>IPv6</b> — 128-bit, contoh <code>2001:db8::25</code>.</li>
        <li><b>Statis</b> = diatur manual; <b>dinamis</b> = otomatis, umumnya lewat DHCP.</li>
      </ul>
      <p><b>DNS</b> (Domain Name System) — menerjemahkan <b>nama domain → alamat IP</b>, mis. portal.kampus.ac.id.</p>
      <p><b>DHCP</b> (Dynamic Host Configuration Protocol) — memberi <b>konfigurasi otomatis</b>: IP address, subnet mask, gateway, DNS server.</p>
      <div class="box tip"><b>Cara ingat:</b> DNS = "buku telepon" (nama→nomor). DHCP = "petugas yang memberi alamat &amp; setting" ke perangkat.</div>
    `},
    { t:"Pengiriman paket & kinerja jaringan", html:`
      <p><b>Pengiriman paket:</b> data disiapkan → <b>dibungkus</b> (diberi informasi kontrol/alamat) → <b>diarahkan</b> menuju tujuan → <b>diproses/disusun ulang</b> di penerima. Analogi: dokumen besar dikirim dalam paket kecil lalu dirakit.</p>
      <table><thead><tr><th>Metrik</th><th>Arti</th><th>Satuan</th><th>Analogi jalan raya</th></tr></thead><tbody>
      <tr><td><b>Bandwidth</b></td><td>Kapasitas maksimum jalur</td><td>bit/s</td><td>Jumlah lajur</td></tr>
      <tr><td><b>Throughput</b></td><td>Laju data nyata yang berhasil diterima</td><td>bit/s</td><td>Kendaraan yang benar-benar lewat</td></tr>
      <tr><td><b>Latency</b></td><td>Waktu tunda perjalanan data</td><td>ms</td><td>Waktu tempuh ke tujuan</td></tr>
      <tr><td><b>Packet loss</b></td><td>Paket hilang saat transmisi</td><td>%</td><td>Kendaraan yang hilang di jalan</td></tr>
      </tbody></table>
      <div class="box warn">Bandwidth besar <u>tidak menjamin</u> respons cepat bila latency tinggi atau packet loss besar. "Jalan lebar tetap bisa macet."</div>
    `},
    { t:"Client–server, wireless, keamanan & troubleshooting", html:`
      <p><b>Client–server:</b> client meminta layanan → server memproses &amp; mengirim hasil. Contoh: browser → web server; SIAKAD → server aplikasi → database. Jika server kelebihan beban, jaringan bagus pun tidak menolong.</p>
      <p><b>Wi-Fi vs seluler:</b> Wi-Fi menghubungkan perangkat ke jaringan lokal via access point; seluler (4G/LTE, 5G) via jaringan operator &amp; cakupan sel. Kualitas dipengaruhi jarak, penghalang, kepadatan pengguna, perangkat, kapasitas.</p>
      <p><b>Pengayaan:</b> Wi-Fi generasi baru (kapasitas &amp; efisiensi), 5G (throughput tinggi, latency rendah), <b>edge computing</b> (pemrosesan dekat sumber data).</p>
      <p><b>Keamanan jaringan:</b> firewall (kebijakan lalu lintas), segmentasi (pisahkan jaringan sesuai hak akses), autentikasi (identitas &amp; izin).</p>
      <div class="box info"><b>Troubleshooting SIAKAD lambat (urut dari terdekat ke pengguna):</b> perangkat pengguna → Wi-Fi/LAN → jaringan kampus/ISP → DNS &amp; IP → server aplikasi/database.</div>
    `}
  ],
  tabel:[
    {judul:"Cakupan jaringan", head:["Jenis","Cakupan","Contoh"],
     rows:[["LAN","Gedung/ruang terbatas","Lab komputer"],
           ["MAN","Kota/kawasan","Jaringan antarlokasi satu kota"],
           ["WAN","Antarkota/negara","Perusahaan antarcabang"],
           ["Internet","Global","Jaringan yang menghubungkan banyak jaringan"]]},
    {judul:"Perangkat jaringan", head:["Perangkat","Fungsi utama"],
     rows:[["Switch","Menghubungkan perangkat dalam LAN"],
           ["Router","Meneruskan paket antarjaringan"],
           ["Access Point","Akses nirkabel untuk perangkat"],
           ["Modem/ONT","Menghubungkan ke layanan ISP"],
           ["Firewall","Mengatur lalu lintas sesuai kebijakan keamanan"]]},
    {judul:"Empat metrik kinerja", head:["Metrik","Definisi singkat","Penyebab buruk"],
     rows:[["Bandwidth","Kapasitas maksimum","Paket layanan kecil"],
           ["Throughput","Laju nyata","Kemacetan, overhead, interferensi"],
           ["Latency","Waktu tunda","Jarak jauh, banyak hop, server lambat"],
           ["Packet loss","Paket hilang","Sinyal lemah, gangguan, overload"]]}
  ],
  kunci:["Jaringan = perangkat terhubung untuk bertukar data & berbagi sumber daya.",
         "5 unsur komunikasi data: pengirim, penerima, media, protokol, pesan.",
         "LAN (gedung) < MAN (kota) < WAN (antarnegara); internet = jaringan global.",
         "Switch = dalam LAN; Router = antarjaringan; AP = nirkabel; Modem/ONT = ke ISP; Firewall = kebijakan.",
         "IPv4 32-bit, IPv6 128-bit; DHCP memberi IP otomatis; DNS menerjemahkan nama → IP.",
         "Bandwidth = kapasitas; throughput = laju nyata; latency = tunda; packet loss = paket hilang.",
         "Wi-Fi ≠ internet; Wi-Fi kampus bisa terhubung walau ISP bermasalah.",
         "Troubleshooting: perangkat → Wi-Fi/LAN → jaringan/ISP → DNS/IP → server."]
},
{
  id:7, tag:"Pertemuan 7", judul:"Internet, Web & Keamanan Data",
  ringkas:"Internet vs Web, URL, HTTP/HTTPS, CIA triad, phishing, malware, insiden keamanan.",
  seksi:[
    { t:"Internet vs Web & layanan di internet", html:`
      <p><b>Internet</b> = infrastruktur global yang menghubungkan banyak jaringan &amp; perangkat dengan protokol komunikasi. <b>WWW</b> = <b>salah satu layanan</b> di internet berupa halaman/aplikasi web yang diakses browser menggunakan HTTP/HTTPS.</p>
      <p><b>Layanan di internet:</b> web, email, cloud (penyimpanan &amp; kolaborasi), video call, messaging, API (pertukaran data antaraplikasi).</p>
      <div class="box tip"><b>Analogi:</b> internet = jalan; website = salah satu tujuan di jalan itu.</div>
    `},
    { t:"Membaca URL & alur membuka website", html:`
      <p>Contoh: <code>https://portal.kampus.ac.id/akademik?semester=1</code></p>
      <ul>
        <li><b>Skema</b> — <code>https://</code> menunjukkan protokol aman.</li>
        <li><b>Domain</b> — <code>portal.kampus.ac.id</code> (nama host).</li>
        <li><b>Path</b> — <code>/akademik</code>; <b>query</b> — <code>?semester=1</code>.</li>
      </ul>
      <p><b>Alur membuka website:</b></p>
      <ol>
        <li><b>URL</b> — pengguna memasukkan alamat.</li>
        <li><b>DNS</b> — nama domain dicari alamat IP-nya.</li>
        <li><b>Koneksi</b> — browser membuat koneksi ke server.</li>
        <li><b>Request</b> — browser meminta halaman/data.</li>
        <li><b>Response</b> — server mengirim respons.</li>
        <li><b>Render</b> — browser menampilkan halaman.</li>
      </ol>
      <p>Jika gagal: penyebab bisa DNS, koneksi, server, sertifikat, atau aplikasi web.</p>
    `},
    { t:"HTTP, HTTPS, dan cookies", html:`
      <p><b>HTTP</b> = protokol komunikasi client–server web. <b>HTTPS</b> = HTTP + <b>TLS</b>: mengenkripsi koneksi, membantu memastikan integritas dan identitas server.</p>
      <p><b>Cookies/session</b> — membantu situs mengingat sesi/preferensi. Jika <b>token sesi dicuri</b>, akun dapat diambil alih.</p>
      <div class="box bad"><b>Jebakan ujian:</b> ikon gembok/HTTPS berarti <b>koneksi terenkripsi</b>, <u>bukan</u> jaminan situs itu jujur/resmi. Situs phishing pun bisa memakai HTTPS.</div>
    `},
    { t:"Data pribadi & CIA Triad", html:`
      <p><b>Data pribadi:</b> identitas (nama, NIK, tanggal lahir, NIM, alamat, kontak), akses digital (email, password, token sesi, OTP, data pemulihan), jejak aktivitas (riwayat transaksi, lokasi, aktivitas belajar).</p>
      <p><b>CIA Triad</b> — tiga tujuan keamanan informasi:</p>

{p:4,q:"Fungsi cache pada CPU adalah ...",o:["menyimpan data/instruksi yang sering dipakai agar CPU tidak selalu mengambil dari RAM","menyimpan file secara permanen","menggantikan fungsi RAM sepenuhnya","menghubungkan CPU ke internet"],a:0,e:"Cache mempercepat akses data yang sering digunakan."},
{p:4,q:"Sifat volatile pada RAM berarti ...",o:["isinya umumnya hilang ketika daya mati","isinya tetap tersimpan setelah daya mati","kapasitasnya tidak terbatas","hanya bisa dibaca, tidak bisa ditulis"],a:0,e:"Volatile = tidak dipertahankan saat daya mati; itu sebabnya harus disimpan ke storage."},
{p:4,q:"Mahasiswa mengetik dokumen tetapi belum menyimpannya, lalu listrik mati dan perubahan terakhir hilang. Penjelasan yang tepat adalah ...",o:["perubahan masih berada di RAM yang bersifat volatile","storage otomatis terhapus seluruhnya","CPU kehilangan instruksi permanen","file system tidak mengenal dokumen tersebut"],a:0,e:"Data tersimpan permanen hanya setelah proses save berhasil ke storage."},
{p:4,q:"Perbedaan utama HDD dan SSD adalah ...",o:["HDD memakai piringan magnetik dan bagian mekanis, SSD memakai memori flash tanpa bagian bergerak","HDD tidak bisa menyimpan sistem operasi","SSD hanya untuk server, HDD hanya untuk laptop","SSD bersifat volatile, HDD persisten"],a:0,e:"SSD berbasis flash dan umumnya lebih responsif; HDD memiliki komponen mekanis."},
{p:4,q:"Pernyataan yang benar tentang RAM dan storage adalah ...",o:["menambah kapasitas SSD tidak sama dengan menambah RAM","RAM dan storage adalah hal yang sama","RAM menyimpan file secara permanen","storage bersifat volatile"],a:0,e:"RAM = ruang kerja sementara; storage = penyimpanan permanen."},
{p:4,q:"Komputer terasa lambat. Tindakan paling tepat adalah ...",o:["memeriksa metrik dan log penggunaan CPU, RAM, storage, serta jaringan sebelum menyimpulkan","langsung mengganti CPU karena pasti rusak","langsung membeli GPU baru","menginstal ulang sistem operasi tanpa pemeriksaan"],a:0,e:"Lambat bisa disebabkan RAM penuh, storage penuh, CPU berat, atau jaringan/server."},
{p:4,q:"Fungsi motherboard adalah ...",o:["menghubungkan CPU, RAM, storage, dan komponen lain","menyimpan data secara permanen","menjalankan sistem operasi","menyediakan koneksi internet seluler"],a:0,e:"Motherboard menjadi papan penghubung antarkomponen."},
{p:4,q:"GPU terutama berperan untuk ...",o:["grafis dan komputasi paralel","menyimpan file jangka panjang","mengelola hak akses file","menerjemahkan nama domain"],a:0,e:"GPU mempercepat grafis dan beban komputasi paralel."},
{p:4,q:"NPU (Neural Processing Unit) adalah ...",o:["mikroprosesor khusus untuk menangani tugas AI/machine learning secara efisien di perangkat","perangkat penyimpanan berkecepatan tinggi","protokol jaringan nirkabel","bagian dari sistem operasi"],a:0,e:"NPU dioptimalkan untuk operasi AI/ML di perangkat."},
{p:4,q:"Latency dalam konteks komputasi/jaringan berarti ...",o:["waktu tunggu suatu akses atau operasi","kapasitas maksimum penyimpanan","jumlah inti prosesor","kecepatan putaran kipas"],a:0,e:"Latency = waktu tunda; makin kecil makin responsif."},
{p:4,q:"Mahasiswa SI dengan anggaran terbatas paling tepat memprioritaskan ...",o:["RAM memadai, SSD, dan CPU kelas menengah dengan GPU terintegrasi","GPU kelas tertinggi untuk semua kebutuhan","CPU termahal tanpa memperhatikan RAM","kapasitas HDD sebesar mungkin tanpa SSD"],a:0,e:"Konfigurasi seimbang lebih tepat; GPU khusus hanya untuk gaming, 3D, atau deep learning."},
{p:4,q:"Mengapa konfigurasi 'CPU sangat tinggi + RAM kecil' kurang tepat?",o:["RAM cepat penuh sehingga sistem memakai paging ke storage dan CPU menunggu data","CPU menjadi tidak kompatibel dengan motherboard","GPU otomatis rusak","Sistem operasi tidak dapat diinstal"],a:0,e:"Paging membuat akses data lebih lambat sehingga kemampuan CPU tidak termanfaatkan."},

/* ---------- PERTEMUAN 5 ---------- */
{p:5,q:"Fungsi utama scanner adalah ...",o:["mengubah dokumen fisik menjadi citra digital","menampilkan gambar ke layar","mencetak dokumen ke kertas","menyimpan data ke cloud"],a:0,e:"Scanner termasuk perangkat input yang mengubah dokumen fisik menjadi citra digital."},
{p:5,q:"Teknologi yang menciptakan sensasi sentuhan, getaran, atau gerakan fisik sebagai umpan balik disebut ...",o:["haptic","hologram","latency","cache"],a:0,e:"Haptic memberikan umpan balik taktil kepada pengguna."},
{p:5,q:"Layar sentuh pada smartphone termasuk ...",o:["perangkat input sekaligus output","hanya perangkat input","hanya perangkat output","bukan perangkat I/O"],a:0,e:"Menerima sentuhan (input) dan menampilkan gambar (output)."},
{p:5,q:"Manakah yang termasuk perangkat output?",o:["Proyektor","Scanner","Mikrofon","Sensor suhu"],a:0,e:"Proyektor menampilkan hasil; scanner, mikrofon, dan sensor adalah input."},
{p:5,q:"Sistem operasi, driver, dan utilitas termasuk kategori ...",o:["system software","application software","programming software","firmware jaringan"],a:0,e:"System software mengelola perangkat dan menyediakan lingkungan kerja."},
{p:5,q:"IDE (Integrated Development Environment) termasuk ...",o:["programming software untuk menulis, menguji, dan memperbaiki kode","system software pengganti OS","application software untuk presentasi","perangkat keras pemrograman"],a:0,e:"IDE membantu pengembang menulis, menguji, dan memperbaiki kode."},
{p:5,q:"SIAKAD dan e-commerce termasuk contoh ...",o:["application software","system software","programming software","driver perangkat"],a:0,e:"Aplikasi yang membantu pekerjaan pengguna = application software."},
{p:5,q:"Peran utama sistem operasi adalah ...",o:["menjadi perantara antara pengguna, aplikasi, dan hardware serta mengatur sumber daya","menggantikan peran brainware","menyimpan data secara permanen tanpa backup","membuat koneksi internet tanpa jaringan"],a:0,e:"OS mengatur CPU, memori, file, I/O, jaringan, dan keamanan."},
{p:5,q:"Manakah yang BUKAN termasuk sumber daya yang dikelola sistem operasi?",o:["Desain grafis dan konten pemasaran","CPU dan proses","Memori (RAM)","Perangkat I/O dan jaringan"],a:0,e:"OS mengelola CPU, memori, file, perangkat I/O, jaringan, dan keamanan."},
{p:5,q:"Perbedaan program dan proses yang tepat adalah ...",o:["program adalah instruksi tersimpan, proses adalah program yang sedang berjalan","program berjalan di RAM, proses tersimpan di disk","keduanya sama persis","proses hanya ada pada server"],a:0,e:"Proses = program aktif beserta konteks eksekusinya."},
{p:5,q:"Kemampuan OS membagi waktu CPU sehingga banyak aplikasi terasa berjalan bersamaan disebut ...",o:["multitasking (time-sharing)","overclocking","defragmentasi","enkripsi"],a:0,e:"OS menjadwalkan giliran CPU; pada multi-core dapat benar-benar paralel."},
{p:5,q:"Ketika RAM penuh, sistem operasi dapat memakai sebagian storage sebagai perpanjangan memori. Mekanisme ini disebut ...",o:["memori virtual","cache L1","swap jaringan","buffer printer"],a:0,e:"Memori virtual/paging membantu, tetapi jauh lebih lambat daripada RAM."},
{p:5,q:"Sistem file NTFS umum digunakan pada ...",o:["Windows","Linux","macOS","Android"],a:0,e:"NTFS (Windows), ext4 (Linux), APFS (macOS)."},
{p:5,q:"Fungsi driver adalah ...",o:["menjadi penerjemah antara sistem operasi dan perangkat keras tertentu","menyimpan file pengguna","mengelola hak akses akun","menghasilkan alamat IP otomatis"],a:0,e:"Driver memungkinkan OS berkomunikasi dengan printer, kartu grafis, audio, dan lain-lain."},
{p:5,q:"Manakah yang termasuk fitur keamanan pada sistem operasi?",o:["Akun dan autentikasi, hak akses, pembaruan, serta firewall/enkripsi","Cache dan register","Bandwidth dan throughput","Cookie dan DNS"],a:0,e:"Keamanan OS = fitur OS + konfigurasi + pembaruan + kebiasaan pengguna."},
{p:5,q:"Perangkat lunak yang mengelola pembagian sumber daya untuk mesin-mesin virtual disebut ...",o:["hypervisor","compiler","firewall","DNS server"],a:0,e:"Hypervisor mengelola VM dan membagi resource komputer fisik."},
{p:5,q:"Perbedaan utama container dengan virtual machine adalah ...",o:["container umumnya berbagi kernel host sehingga lebih ringan","container selalu memiliki guest OS sendiri","VM tidak membutuhkan sistem operasi","container tidak dapat menjalankan aplikasi"],a:0,e:"VM punya guest OS sendiri dan lebih berat; container berbagi kernel host."},
{p:5,q:"Saat pengguna membuka browser, urutan yang paling tepat adalah ...",o:["klik ikon → OS membuat proses dan alokasi RAM → permintaan jaringan → CPU/RAM memproses → halaman tampil","klik ikon → printer mencetak → DNS menyimpan file → RAM dimatikan","buka browser → storage dihapus → CPU berhenti → halaman tampil","permintaan jaringan → klik ikon → OS mati → halaman tampil"],a:0,e:"Input → OS mengelola proses/RAM → jaringan → pemrosesan → output."},
{p:5,q:"SIAKAD lambat saat KRS. Manakah pendekatan pemeriksaan yang paling tepat?",o:["periksa bertahap: perangkat pengguna, aplikasi/OS, jaringan, lalu server dan database","langsung menyimpulkan internet kampus putus","langsung mengganti seluruh komputer mahasiswa","mengabaikan karena pasti masalah browser"],a:0,e:"Jangan menyimpulkan satu penyebab; periksa tiap lapisan dengan bukti."},
{p:5,q:"Mengapa backup tetap diperlukan walaupun sistem operasi sudah memiliki file system?",o:["karena file dapat terhapus, perangkat rusak, atau terkena ransomware","karena file system tidak bisa menyimpan file","karena backup menggantikan fungsi RAM","karena file system hanya ada di Linux"],a:0,e:"File system mengatur penyimpanan, bukan menjamin pemulihan bencana."},

/* ---------- PERTEMUAN 6 ---------- */
{p:6,q:"Jaringan komputer didefinisikan sebagai ...",o:["sekumpulan perangkat yang saling terhubung untuk bertukar data dan berbagi sumber daya","kumpulan aplikasi yang berjalan di satu komputer","sistem operasi yang menghubungkan pengguna","basis data yang menyimpan data jaringan"],a:0,e:"Tujuan jaringan: bertukar data dan berbagi sumber daya (printer, file, aplikasi, database)."},
{p:6,q:"Lima unsur komunikasi data adalah ...",o:["pengirim, penerima, media, protokol, dan pesan","client, server, database, API, dan cloud","IP, DNS, DHCP, router, dan switch","bandwidth, throughput, latency, packet loss, dan jitter"],a:0,e:"Analogi kurir: pengirim, alamat tujuan, jalur, isi pesan, aturan layanan."},
{p:6,q:"Jaringan komputer di satu laboratorium kampus termasuk ...",o:["LAN","MAN","WAN","internet"],a:0,e:"LAN mencakup wilayah terbatas seperti ruangan/gedung."},
{p:6,q:"Jaringan yang menghubungkan beberapa lokasi dalam satu kota disebut ...",o:["MAN","LAN","WAN","PAN"],a:0,e:"MAN = Metropolitan Area Network (skala kota/kawasan)."},
{p:6,q:"Jaringan perusahaan yang menghubungkan cabang antarkota dan antarnegara termasuk ...",o:["WAN","LAN","MAN","intranet lokal"],a:0,e:"WAN mencakup wilayah luas."},
{p:6,q:"Jaringan atau layanan internal organisasi dengan akses terbatas disebut ...",o:["intranet","internet","ekstranet publik","Wi-Fi"],a:0,e:"Intranet = jaringan/layanan internal, misalnya portal pegawai."},
{p:6,q:"Pernyataan yang tepat tentang Wi-Fi adalah ...",o:["Wi-Fi adalah teknologi akses lokal tanpa kabel dan tidak otomatis berarti internet tersedia","Wi-Fi selalu identik dengan internet","Wi-Fi hanya bekerja dengan kabel","Wi-Fi adalah protokol email"],a:0,e:"Wi-Fi terhubung ke access point; internet tetap bergantung pada koneksi ISP."},
{p:6,q:"Fungsi switch adalah ...",o:["menghubungkan perangkat dalam jaringan lokal (LAN)","meneruskan paket antarjaringan","menerjemahkan nama domain","menyediakan alamat IP otomatis"],a:0,e:"Switch bekerja di dalam LAN; router antarjaringan."},
{p:6,q:"Fungsi router adalah ...",o:["meneruskan paket data antarjaringan","menghubungkan perangkat dalam satu LAN saja","mengubah sinyal optik menjadi listrik","menyimpan cache halaman web"],a:0,e:"Router mengarahkan paket dari satu jaringan ke jaringan tujuan."},
{p:6,q:"Perangkat yang menyediakan akses nirkabel bagi laptop dan ponsel disebut ...",o:["access point","switch","modem","firewall"],a:0,e:"Access point menyediakan akses Wi-Fi."},
{p:6,q:"Modem/ONT berfungsi untuk ...",o:["menghubungkan jaringan pelanggan dengan layanan akses ISP","mengatur hak akses pengguna","menyimpan basis data","memisahkan jaringan administrasi"],a:0,e:"Modem/ONT menjadi titik penghubung ke layanan ISP."},
{p:6,q:"Perangkat yang mengatur lalu lintas jaringan berdasarkan kebijakan keamanan adalah ...",o:["firewall","switch","access point","repeater"],a:0,e:"Firewall memfilter lalu lintas sesuai aturan keamanan."},
{p:6,q:"Keunggulan utama fiber optic dibanding twisted pair adalah ...",o:["kapasitas tinggi dan cocok untuk jarak jauh","lebih murah untuk semua kebutuhan","tidak memerlukan protokol","tidak terpengaruh konfigurasi IP"],a:0,e:"Fiber mengirim data dengan cahaya: kapasitas besar, jarak jauh."},
{p:6,q:"Alamat IPv4 menggunakan panjang ...",o:["32 bit","64 bit","128 bit","16 bit"],a:0,e:"IPv4 = 32-bit (contoh 192.168.10.25); IPv6 = 128-bit."},
{p:6,q:"Alamat IPv6 menggunakan panjang ...",o:["128 bit","32 bit","64 bit","256 bit"],a:0,e:"IPv6 = 128-bit, contoh 2001:db8::25."},
{p:6,q:"Fungsi DNS adalah ...",o:["menerjemahkan nama domain menjadi alamat IP","memberikan alamat IP otomatis","mengatur bandwidth per pengguna","mengenkripsi lalu lintas web"],a:0,e:"DNS seperti buku telepon: nama domain → alamat IP."},
{p:6,q:"Fungsi DHCP adalah ...",o:["memberikan konfigurasi jaringan otomatis seperti IP, subnet mask, gateway, dan DNS server","menerjemahkan nama domain menjadi IP","meneruskan paket antarjaringan","menyimpan cache halaman web"],a:0,e:"DHCP membagikan konfigurasi jaringan secara otomatis."},
{p:6,q:"Urutan pengiriman data melalui jaringan yang paling tepat adalah ...",o:["data disiapkan → dibungkus menjadi paket → diarahkan ke tujuan → diproses/disusun ulang penerima","data dihapus → dikirim → dienkripsi → dibuang","paket dirakit → data disiapkan → diterima → diarahkan","data disiapkan → diterima → dibungkus → diarahkan"],a:0,e:"Analogi: dokumen besar dikirim dalam paket kecil lalu dirakit di tujuan."},
{p:6,q:"Bandwidth didefinisikan sebagai ...",o:["kapasitas maksimum jalur komunikasi dalam bit per detik","laju data nyata yang berhasil diterima","waktu tunda perjalanan data","jumlah paket yang hilang"],a:0,e:"Bandwidth = kapasitas; throughput = laju nyata."},
{p:6,q:"Throughput adalah ...",o:["laju data nyata yang berhasil diterima pada kondisi tertentu","kapasitas maksimum jalur","waktu tunda data","jumlah perangkat terhubung"],a:0,e:"Throughput bisa lebih rendah dari bandwidth karena kemacetan/overhead."},
{p:6,q:"Mengapa bandwidth besar belum menjamin aplikasi terasa cepat?",o:["karena latency tinggi, packet loss, atau server lambat tetap memperlambat respons","karena bandwidth tidak berhubungan dengan jaringan","karena bandwidth hanya berlaku untuk email","karena throughput selalu lebih besar dari bandwidth"],a:0,e:"Analogi: jalan lebar tetap bisa macet."},
{p:6,q:"Pola client-server berarti ...",o:["client meminta layanan, server memproses permintaan dan mengirim hasil","server meminta data ke client","kedua perangkat selalu melakukan hal sama","tidak ada pertukaran data"],a:0,e:"Contoh: browser → web server → server aplikasi → database."},
{p:6,q:"Jika SIAKAD lambat bagi banyak pengguna, langkah pemeriksaan pertama yang paling tepat adalah ...",o:["menelusuri dari yang paling dekat pengguna: perangkat, Wi-Fi/LAN, jaringan/ISP, DNS/IP, lalu server","langsung menyimpulkan server kampus rusak total","langsung mengganti router kampus","mengabaikan karena bukan masalah teknis"],a:0,e:"Prinsip: telusuri dari bagian terdekat pengguna menuju layanan tujuan."},
{p:6,q:"Perbedaan Wi-Fi dan jaringan seluler adalah ...",o:["Wi-Fi menghubungkan perangkat ke jaringan lokal via access point, seluler melalui jaringan operator dan cakupan sel","Wi-Fi menggunakan kabel, seluler nirkabel","seluler hanya untuk data, Wi-Fi hanya untuk suara","keduanya identik"],a:0,e:"Wi-Fi lokal via AP; seluler 4G/5G via operator."},
/* ---------- PERTEMUAN 7 ---------- */
{p:7,q:"Perbedaan internet dan World Wide Web yang paling tepat adalah ...",o:["internet adalah infrastruktur jaringan global, WWW adalah salah satu layanan di atasnya","internet adalah layanan, WWW adalah infrastruktur","keduanya adalah nama yang sama","WWW adalah perangkat keras, internet adalah perangkat lunak"],a:0,e:"Analogi: internet = jalan; website = salah satu tujuan di jalan itu."},
{p:7,q:"Pada URL https://portal.kampus.ac.id/akademik?semester=1, bagian 'portal.kampus.ac.id' adalah ...",o:["domain/nama host","skema protokol","path","query parameter"],a:0,e:"Skema = https://; domain = portal.kampus.ac.id; path = /akademik; query = semester=1."},
{p:7,q:"Bagian '?semester=1' pada URL tersebut adalah ...",o:["query parameter","domain","skema","path"],a:0,e:"Query parameter diawali tanda tanya dan berisi pasangan kunci=nilai."},
{p:7,q:"Pernyataan yang benar tentang HTTPS adalah ...",o:["HTTPS berarti koneksi terenkripsi, tetapi tidak menjamin situs itu jujur atau resmi","HTTPS menjamin situs pasti resmi","HTTPS tidak menggunakan enkripsi","HTTPS hanya dipakai situs pemerintah"],a:0,e:"Ikon gembok hanya menunjukkan koneksi aman secara teknis, bukan reputasi pemilik situs."},
{p:7,q:"Urutan yang benar saat browser membuka sebuah website adalah ...",o:["URL → DNS → koneksi → request → response → render","DNS → URL → render → request → koneksi → response","request → response → URL → DNS → koneksi → render","URL → render → DNS → response → koneksi → request"],a:0,e:"Enam langkah tersebut adalah alur baku akses web."},
{p:7,q:"HTTPS berbeda dari HTTP karena HTTPS ...",o:["menggunakan TLS untuk mengenkripsi koneksi serta membantu integritas dan identitas server","tidak memerlukan alamat IP","tidak menggunakan DNS","hanya bekerja pada email"],a:0,e:"HTTPS = HTTP + TLS."},
{p:7,q:"Risiko utama jika token sesi (cookie) dicuri adalah ...",o:["akun dapat diambil alih oleh pihak lain","kapasitas RAM berkurang","IP address berubah otomatis","file system rusak"],a:0,e:"Token sesi yang dicuri memungkinkan penyerang menyamar sebagai pengguna."},
{p:7,q:"Manakah yang termasuk data akses digital yang harus dilindungi?",o:["Email, password, token sesi, dan kode OTP","Warna favorit dan hobi","Merek laptop yang dipakai","Jenis koneksi Wi-Fi"],a:0,e:"Data akses digital mencakup kredensial dan token; OTP tidak boleh dibagikan."},
{p:7,q:"Nilai mahasiswa hanya dapat diakses oleh pihak yang berhak. Ini adalah penerapan prinsip ...",o:["Confidentiality","Integrity","Availability","Redundancy"],a:0,e:"Confidentiality = kerahasiaan, hanya pihak berwenang yang dapat melihat."},
{p:7,q:"Nilai tidak boleh berubah tanpa proses resmi dan perubahan dapat ditelusuri. Ini adalah penerapan ...",o:["Integrity","Confidentiality","Availability","Scalability"],a:0,e:"Integrity = data utuh, tidak diubah tanpa izin, perubahan terlacak."},
{p:7,q:"SIAKAD tetap dapat digunakan saat periode KRS. Ini adalah penerapan ...",o:["Availability","Confidentiality","Integrity","Authentication"],a:0,e:"Availability = ketersediaan layanan saat dibutuhkan."},
{p:7,q:"Pertanyaan 'Siapa Anda?' dan verifikasi melalui password/OTP termasuk ...",o:["authentication","authorization","availability","segmentasi"],a:0,e:"Authentication memverifikasi identitas; authorization menentukan hak akses."},
{p:7,q:"Mahasiswa dapat melihat nilainya sendiri tetapi tidak dapat mengubah nilai seluruh kelas. Ini adalah contoh ...",o:["authorization","authentication","enkripsi","backup"],a:0,e:"Authorization mengatur apa yang boleh diakses setelah identitas terverifikasi."},
{p:7,q:"MFA (Multi-Factor Authentication) berarti ...",o:["menambahkan faktor verifikasi lain selain password","mengganti password dengan PIN","menggunakan satu password untuk semua akun","mematikan verifikasi saat login"],a:0,e:"MFA menambah lapisan; OTP/prompt login tetap tidak boleh dibagikan atau disetujui sembarangan."},
{p:7,q:"Keunggulan passkey dibanding password biasa adalah ...",o:["berbasis kriptografi sehingga dapat mengurangi risiko phishing","tidak memerlukan perangkat","bisa dibagikan ke teman","tidak memerlukan verifikasi sama sekali"],a:0,e:"Passkey mengurangi risiko pencurian kredensial lewat situs palsu."},
{p:7,q:"Manakah yang merupakan indikator kuat sebuah pesan phishing?",o:["Ancaman mendesak dan permintaan password/OTP melalui tautan","Pesan dikirim pada jam kerja","Pesan menggunakan bahasa formal","Pesan menyertakan nama pengirim"],a:0,e:"Indikator: urgensi, domain mirip, permintaan rahasia, lampiran/tautan tak terduga, kanal tak wajar."},
{p:7,q:"Tindakan paling aman setelah memindai kode QR yang mengaku sebagai portal kampus adalah ...",o:["memeriksa domain yang terbuka dan membuka layanan resmi secara manual bila ragu","langsung memasukkan password agar cepat selesai","membagikan QR ke teman agar ikut memindai","mengabaikan domain karena QR pasti aman"],a:0,e:"QR dapat mengarah ke situs palsu; verifikasi domain dan akses layanan resmi secara manual."},
{p:7,q:"Ransomware adalah malware yang ...",o:["mengenkripsi data atau mengganggu sistem lalu meminta tebusan","hanya menampilkan iklan","mempercepat kinerja perangkat","membackup data secara otomatis"],a:0,e:"Pembayaran tebusan tidak menjamin pemulihan; backup teruji adalah pertahanan utama."},
{p:7,q:"Cara paling tepat menghadapi panggilan suara/video yang mengaku sebagai dosen dan meminta transfer mendesak adalah ...",o:["memverifikasi balik melalui nomor/kanal resmi yang sudah dikenal","percaya karena suaranya mirip","mengirim OTP agar prosesnya cepat","mengikuti instruksi tanpa bertanya"],a:0,e:"Voice cloning/deepfake bisa meyakinkan; verifikasi lewat kanal yang sudah dikenal."},
